# Gestão Saotech — o endereço principal agora é o GitHub Pages (gratuito e sem limite de publicações).
# Quando o Netlify voltar a publicar (novo ciclo de créditos), este arquivo faz o link
# gestaosaotech.netlify.app levar todo mundo para a versão sempre atualizada no GitHub Pages.
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to = "https://isabellaperes2508-alt.github.io/gestao-saotech/:splat"
  status = 301
  force = true
