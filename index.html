function viewClientes(){
  const q = (S.cliBusca || "").toLowerCase();
  let lista = S.demandas.slice();
  if (S.cliFiltro === "ativas") lista = lista.filter(d => ATIVAS.includes(d.etapa) || d.etapa === "Pausada");
  if (S.cliFiltro === "pendencias") lista = lista.filter(d => !d.exemplo && pendenciasDe(d).length);
  const nPend = S.demandas.filter(d => !d.exemplo && pendenciasDe(d).length).length;
  if (q) lista = lista.filter(d => [d.codigo, d.cliente, d.imovel, d.municipio, d.contato, d.documento, soDig(d.documento), d.imovelDados?.codigoIR, d.imovelDados?.matricula, d.imovelDados?.car].join(" ").toLowerCase().includes(q));
  lista.sort((a, b) => (a.cliente || "").localeCompare(b.cliente || "", "pt-BR"));
  if (!lista.some(d => d.id === S.cliSel)) S.cliSel = lista[0]?.id || null;
  const sel = S.demandas.find(d => d.id === S.cliSel);
  const side = `<aside class="side card">

    <div class="lst">${lista.map(d => { const cl = d.checklist || []; const ok = cl.filter(i => i.ok).length; return `<button type="button" class="side-it" data-cli="${d.id}" aria-current="${d.id === S.cliSel}">
      <span class="r1"><b>${esc(d.cliente)}</b>${temNovidade(d) ? `<span class="ndot" title="Mensagem nova"></span>` : ""}</span>
      <span class="prev">${pendenciasDe(d).length && !d.exemplo ? `<span class="pend-n" title="Cadastro incompleto">${pendenciasDe(d).length} pendência${pendenciasDe(d).length > 1 ? "s" : ""}</span> ` : ""}${d.propriedadeN && d.clienteId && propriedadesDe(d.clienteId).length > 1 ? `Propriedade ${d.propriedadeN}/${propriedadesDe(d.clienteId).length} · ` : ""}${esc(d.codigo)} · ${esc(d.etapa)}${d.municipio ? " · " + esc(d.municipio) : ""}${(d.vinculos || []).some(v => v.rel === "Confrontante") ? " · " + d.vinculos.filter(v => v.rel === "Confrontante").length + " confrontante(s)" : ""}</span>
      ${cl.length ? `<span class="prog"><i style="width:${Math.round(ok / cl.length * 100)}%"></i></span>` : ""}
    </button>`; }).join("") || `<p class="sub" style="padding:8px 12px">${S.conectado ? "Nenhum cliente encontrado." : "Carregando…"}</p>`}</div>
  </aside>`;
  if (S.cliFiltro === "pendencias") return `<div class="split">${side}<div>${pendenciasViewHtml(lista)}</div></div>`;

/* =====================================================================
   v9 — painel financeiro, alertas, recibos, pré-visualização, mapa,
   perfis de acesso, duplicar estrutura, histórico de auditoria e busca
   ===================================================================== */
const MESES_CURTOS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesRot = ym => { const [y, m] = ym.split("-").map(Number); return MESES_CURTOS[m - 1] + (y !== new Date().getFullYear() ? "/" + String(y).slice(2) : ""); };
const somaMes = (ym, n) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const brlK = v => v >= 1000 ? "R$ " + (v / 1000).toLocaleString("pt-BR", {maximumFractionDigits: 1}) + " mil" : brl(v);

/* ---------- 1a. Painel financeiro (gráficos) ---------- */
function finParcelasTodas(){
  const out = [];
  for (const d of S.demandas) for (const p of (S.fin[d.id]?.parcelas || [])) out.push({d, p});
  return out;
}
function finAlertas(){
  if (!S.podeFin) return [];
  const lim = addDias(hoje(), 3);
  return finParcelasTodas().filter(x => !x.p.pago && x.p.vencimento && x.p.vencimento <= lim).sort((a, b) => a.p.vencimento < b.p.vencimento ? -1 : 1);
}
function cobrarWa(d, p){
  const tel = telefone(d.contato); const nome = (d.cliente || "").split(/\s+[—–-]\s+/)[0];
  const atras = p.vencimento < hoje();
  const txt = `Olá, ${nome}! Aqui é ${primeiro(S.me)}, da Saotech Geotecnologia.\n\n${atras ? `Identificamos que a ${p.rotulo.toLowerCase()} do contrato, no valor de ${brl(p.valor)}, venceu em ${fmtData(p.vencimento)} e ainda não consta como paga.` : `Lembrando que a ${p.rotulo.toLowerCase()} do contrato, no valor de ${brl(p.valor)}, vence em ${fmtData(p.vencimento)}.`}\n\nSe já realizou o pagamento, pode nos enviar o comprovante por aqui. Qualquer dúvida, estamos à disposição.`;
  return `https://wa.me/${tel}?text=${encodeURIComponent(txt)}`;
}
function graficoFluxo(){
  const atual = hoje().slice(0, 7);
  const meses = []; for (let i = -5; i <= 6; i++) meses.push(somaMes(atual, i));
  const rec = Object.fromEntries(meses.map(m => [m, 0])), prev = Object.fromEntries(meses.map(m => [m, 0])); let atrasado = 0;
  for (const {p} of finParcelasTodas()) {
    if (p.pago) { const m = (p.pago.data || "").slice(0, 7); if (m in rec) rec[m] += p.pago.valor ?? p.valor ?? 0; }
    else if (p.vencimento) { if (p.vencimento < hoje()) atrasado += p.valor || 0; else { const m = p.vencimento.slice(0, 7); if (m in prev) prev[m] += p.valor || 0; } }
  }
  const max = Math.max(1, ...meses.map(m => rec[m] + prev[m] + (m === atual ? atrasado : 0)));
  const W = 720, H = 250, pl = 8, pb = 34, pt = 34, bw = (W - pl * 2) / meses.length;
  const y = v => (H - pb) - v / max * (H - pb - pt);
  let bars = "";
  meses.forEach((m, i) => {
    const x = pl + i * bw + bw * 0.18, w = bw * 0.64; let base = H - pb;
    const seg = (v, cls, tit) => { if (!v) return ""; const h = (H - pb) - y(v); base -= h; return `<rect x="${x.toFixed(1)}" y="${base.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="3" class="${cls}"><title>${tit}: ${brl(v)}</title></rect>`; };
    bars += seg(rec[m], "g-rec", "Recebido em " + mesRot(m)) + seg(prev[m], "g-prev", "Previsto para " + mesRot(m)) + (m === atual ? seg(atrasado, "g-atr", "Em atraso") : "");
    const tot = rec[m] + prev[m] + (m === atual ? atrasado : 0);
    if (tot) bars += `<text x="${(x + w / 2).toFixed(1)}" y="${(base - 5).toFixed(1)}" class="g-v">${esc(brlK(tot).replace("R$ ", ""))}</text>`;
    bars += `<text x="${(x + w / 2).toFixed(1)}" y="${H - pb + 16}" class="g-x ${m === atual ? "cur" : ""}">${mesRot(m)}</text>`;
  });
  const sep = pl + 6 * bw - 1;
  return `<svg viewBox="0 0 ${W} ${H}" class="grafico" role="img" aria-label="Fluxo de caixa mensal: recebido, previsto e em atraso">
    <line x1="${pl}" x2="${W - pl}" y1="${H - pb}" y2="${H - pb}" class="g-ax"/>
    <line x1="${sep}" x2="${sep}" y1="4" y2="${H - pb}" class="g-sep"/><text x="${sep + 6}" y="12" class="g-lbl">projeção →</text><text x="${sep - 6}" y="12" class="g-lbl" text-anchor="end">← realizado</text>
    ${bars}</svg>
    <div class="g-leg"><span><i class="g-rec"></i>Recebido</span><span><i class="g-prev"></i>A receber (previsto)</span><span><i class="g-atr"></i>Em atraso</span></div>`;
}
function finDashboardHtml(){
  const todas = finParcelasTodas();
  const atrasadas = todas.filter(x => !x.p.pago && x.p.vencimento && x.p.vencimento < hoje()).sort((a, b) => a.p.vencimento < b.p.vencimento ? -1 : 1);
  const valAtr = atrasadas.reduce((s, x) => s + (x.p.valor || 0), 0);
  const recebidoTot = todas.reduce((s, x) => s + (x.p.pago ? (x.p.pago.valor ?? x.p.valor ?? 0) : 0), 0);
  const taxa = recebidoTot + valAtr ? Math.round(valAtr / (recebidoTot + valAtr) * 1000) / 10 : 0;
  const prox30 = todas.filter(x => !x.p.pago && x.p.vencimento >= hoje() && x.p.vencimento <= addDias(hoje(), 30)).reduce((s, x) => s + (x.p.valor || 0), 0);
  const prox90 = todas.filter(x => !x.p.pago && x.p.vencimento >= hoje() && x.p.vencimento <= addDias(hoje(), 90)).reduce((s, x) => s + (x.p.valor || 0), 0);

      <div class="fin-sum" style="grid-template-columns:repeat(2,minmax(0,1fr))">

        <div><span class="label">Inadimplência</span><b class="${taxa > 10 ? "crit-t" : ""}">${String(taxa).replace(".", ",")}%</b><span class="sub">do valor já vencido</span></div>
        <div><span class="label">Próximos 30 dias</span><b>${brl(prox30)}</b></div>
        <div><span class="label">Próximos 90 dias</span><b>${brl(prox90)}</b></div>
      </div>
      ${atrasadas.length ? `<div class="label" style="margin:12px 0 4px">Parcelas em atraso</div>${atrasadas.slice(0, 8).map(({d, p}) => `<div class="fin-pg"><div><b>${esc(d.cliente)}</b><div class="sub">${esc(p.rotulo)} · ${brl(p.valor)} · venceu ${fmtData(p.vencimento)} (${-diff(p.vencimento, hoje())} d)</div></div><div><a class="btn sm" href="${cobrarWa(d, p)}" target="_blank" rel="noopener">Cobrar no WhatsApp</a><button type="button" class="btn sm ghost" data-pgto="${d.id}|${p.id}">Registrar</button></div></div>`).join("")}` : `<p class="sub" style="margin:12px 0 0">Nenhuma parcela em atraso.</p>`}
    </div></div>`;
}

/* ---------- 1c. Recibo em PDF ---------- */
function extenso(v){
  const u = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  const dz = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  const ct = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const ate999 = n => { if (n === 100) return "cem"; const c = Math.floor(n / 100), r = n % 100; const p = []; if (c) p.push(ct[c]); if (r) p.push(r < 20 ? u[r] : dz[Math.floor(r / 10)] + (r % 10 ? " e " + u[r % 10] : "")); return p.join(" e "); };
  const inteiro = n => { if (!n) return "zero"; const mi = Math.floor(n / 1e6), mil = Math.floor(n % 1e6 / 1000), r = n % 1000; const p = [];
    if (mi) p.push(mi === 1 ? "um milhão" : ate999(mi) + " milhões"); if (mil) p.push(mil === 1 ? "mil" : ate999(mil) + " mil"); if (r) p.push(ate999(r));
    return p.length > 1 && (r < 100 || r % 100 === 0) && r ? p.slice(0, -1).join(", ") + " e " + p.slice(-1) : p.join(", "); };
  const reais = Math.floor(v + 1e-9), cent = Math.round((v - reais) * 100);
  const parte = reais ? inteiro(reais) + (reais === 1 ? " real" : (reais % 1e6 === 0 ? " de reais" : " reais")) : "";
  const c = cent ? inteiro(cent) + (cent === 1 ? " centavo" : " centavos") : "";
  return [parte, c].filter(Boolean).join(" e ") || "zero real";
}

function abrirDuplicar(id){
  const d = S.demandas.find(x => x.id === id); if (!d || S.somenteLeitura) return;
  if (S.dlg) (S.dlg.unsubs || []).forEach(u => { try { u(); } catch {} });
  S.dlg = {tipo: "duplicar", id, unsubs: []};
  const dlg = $("#dlg"); dlg.className = "";
  const base = (d.cliente || "").split(/\s+[—–]\s+/)[0];
  dlg.innerHTML = `<div class="dlg-h"><div><span class="label">Duplicar estrutura de ${esc(d.codigo)}</span><h2 style="font-size:19px">Novo processo a partir deste</h2></div><button type="button" class="btn ghost" data-close aria-label="Fechar">✕</button></div>
  <form id="fDup" class="dlg-b">
    <label class="f">Nome do novo processo<input id="dup-nome" required value="${esc(base)} — "></label>
    <div class="checks" style="margin-top:12px">
      <label><input type="checkbox" id="dup-check" checked> Serviços e checklist (itens desmarcados)</label>
      <label><input type="checkbox" id="dup-dados" checked> Contato, município e responsável</label>
      <label><input type="checkbox" id="dup-vinc" checked> Vincular como "mesmo cliente"</label>
      <label><input type="checkbox" id="dup-conf"> Copiar também os confrontantes vinculados</label>
    </div>
    <label class="f" style="margin-top:12px">Quantas cópias<input id="dup-n" type="number" min="1" max="10" value="1"></label>
    <p class="sub" style="margin:8px 0 0">Com mais de uma cópia, os nomes recebem a numeração (1), (2)…</p>
  </form>
  <div class="dlg-f"><span></span><div style="display:flex;gap:8px"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" form="fDup" class="btn primary" id="dup-save">Criar</button></div></div>`;
  if (!dlg.open) dlg.showModal();
  $("#fDup").addEventListener("submit", async e => {
    e.preventDefault(); const btn = $("#dup-save"); btn.disabled = true; btn.textContent = "Criando…";
    const n = Math.min(10, Math.max(1, +$("#dup-n").value || 1)); const nome0 = $("#dup-nome").value.trim();
    const cCheck = $("#dup-check").checked, cDados = $("#dup-dados").checked, cVinc = $("#dup-vinc").checked, cConf = $("#dup-conf").checked;
    const criados = [];
    try {
      let seq = proximoCodigo();
      for (let i = 0; i < n; i++) {
        const ref = S.db.collection("demandas").doc(); const agora = agoraISO();
        const vinculos = [...(cVinc ? [{id: d.id, rel: "Mesmo cliente", obs: ""}] : []), ...(cConf ? (d.vinculos || []).filter(v => v.rel === "Confrontante") : [])];
        const corpo = {codigo: seq, cliente: n > 1 ? `${nome0} (${i + 1})` : nome0, servicos: cCheck ? [...(d.servicos || [])] : [], etapa: "Orçamento",
          responsavel: cDados ? d.responsavel : S.me, prazo: null, contato: cDados ? d.contato || "" : "", imovel: "", municipio: cDados ? d.municipio || "" : "", areaHa: null,
          protocoloOrgao: "", protocoloNumero: "", protocoloPrevisao: null, notas: `Estrutura duplicada de ${d.codigo} · ${d.cliente}.`, exemplo: false,
          checklist: cCheck ? (d.checklist || []).map(it => ({id: uid(), t: it.t, doc: !!it.doc, ok: false})) : [], vinculos,
          historico: [{em: agora, pessoa: S.me, txt: `criou a demanda duplicando a estrutura de ${d.codigo}`}], criadoEm: agora, atualizadoEm: agora, atualizadoPor: S.me};
        await ref.set(corpo); criados.push({id: ref.id, cliente: corpo.cliente, vinculos});
        seq = seq.replace(/(\d+)$/, m => String(+m + 1).padStart(3, "0"));
      }
      if (cVinc || cConf) {
        const mapa = {};
        for (const c of criados) for (const v of c.vinculos) (mapa[v.id] = mapa[v.id] || []).push({id: c.id, rel: v.rel, obs: "", cliente: c.cliente});
        for (const [alvo, add] of Object.entries(mapa)) { const o = S.demandas.find(x => x.id === alvo); if (!o) continue;
          await S.db.doc("demandas/" + alvo).update({vinculos: [...(o.vinculos || []), ...add.map(({cliente, ...v}) => v)], historico: histAdd(o, `vinculou ${add.map(a => a.cliente).join(", ")}`)}); }
      }
      toast(n > 1 ? `${n} processos criados` : "Processo criado"); irProcesso(criados[0].id);
    } catch (err) { falhaEscrita(err); btn.disabled = false; btn.textContent = "Criar"; }
  });
}

/* ---------- 5a. Histórico / auditoria ---------- */
function eventosAuditoria(){
  const ev = [];
  for (const d of S.demandas) for (const h of d.historico || []) ev.push({em: h.em, pessoa: h.pessoa, txt: h.txt, alvo: d.cliente, dem: d.id, tipo: "Demandas"});
  if (S.podeFin) for (const d of S.demandas) for (const h of (S.fin[d.id]?.log || [])) ev.push({em: h.em, pessoa: h.pessoa, txt: h.txt, alvo: d.cliente, dem: d.id, tipo: "Financeiro"});
  for (const a of S.agenda) if (a.criadoEm) { const d = S.demandas.find(x => x.id === a.demandaId); ev.push({em: a.criadoEm, pessoa: a.criadoPor, txt: `agendou ${a.tipo.toLowerCase()} para ${fmtData(a.data)} ${a.inicio || ""}${a.titulo ? " — " + a.titulo : ""}`, alvo: d?.cliente || "", dem: d?.id, tipo: "Agenda"}); }
  for (const x of S.expediente) { if (x.inicio) ev.push({em: x.inicio, pessoa: x.pessoa, txt: "iniciou o dia", tipo: "Expediente"}); if (x.fim) ev.push({em: x.fim, pessoa: x.pessoa, txt: "finalizou o dia", tipo: "Expediente"}); }
  return ev.filter(e => e.em).sort((a, b) => a.em < b.em ? 1 : -1);
}
function viewHistorico(){
  const dias = S.audDias || 30, lim = new Date(Date.now() - dias * 864e5).toISOString();
  const q = (S.audBusca || "").toLowerCase();
  let ev = eventosAuditoria().filter(e => e.em >= lim);
  if (S.audPessoa) ev = ev.filter(e => e.pessoa === S.audPessoa);
  if (S.audTipo) ev = ev.filter(e => e.tipo === S.audTipo);
  if (q) ev = ev.filter(e => (e.txt + " " + (e.alvo || "") + " " + pessoa(e.pessoa).nome).toLowerCase().includes(q));
  const tipos = ["Demandas", "Agenda", "Expediente", ...(S.podeFin ? ["Financeiro"] : [])];
  let dia = "", h = "";
  for (const e of ev.slice(0, 400)) {
    const dd = new Date(e.em).toLocaleDateString("sv-SE");
    if (dd !== dia) { dia = dd; h += `<div class="aud-dia">${dd === hoje() ? "Hoje" : esc(capital(fmtDia(dd)))}</div>`; }
    h += `<div class="aud-it"><time>${fmtHora(e.em)}</time><span class="chip aud-${e.tipo.toLowerCase()}">${esc(e.tipo)}</span><div><b>${esc(pessoa(e.pessoa).nome)}</b> ${esc(e.txt)}${e.alvo ? ` · ${e.dem ? `<a href="#" data-proc="${e.dem}">${esc(e.alvo)}</a>` : esc(e.alvo)}` : ""}</div></div>`;
  }
  return `<div class="toolbar">
    <input class="grow" id="aud-busca" type="search" placeholder="Buscar no histórico (ex.: parcela, protocolo, nome do cliente)" value="${esc(S.audBusca || "")}">
    <select id="aud-pessoa" aria-label="Pessoa"><option value="">Toda a equipe</option>${PESSOAS.map(p => `<option value="${p.id}" ${S.audPessoa === p.id ? "selected" : ""}>${esc(p.nome)}</option>`).join("")}</select>
    <select id="aud-tipo" aria-label="Tipo"><option value="">Todos os tipos</option>${tipos.map(t => `<option ${S.audTipo === t ? "selected" : ""}>${t}</option>`).join("")}</select>
    <select id="aud-dias" aria-label="Período">${[7, 30, 90, 365].map(n => `<option value="${n}" ${dias === n ? "selected" : ""}>Últimos ${n} dias</option>`).join("")}</select>
  </div>
  <div class="card">${h || `<p class="muted" style="margin:0">Nenhuma alteração encontrada neste filtro.</p>`}${ev.length > 400 ? `<p class="sub">Mostrando as 400 mais recentes de ${ev.length}.</p>` : ""}</div>`;
}

/* ---------- CPF / CNPJ ---------- */
const soDig = t => String(t || "").replace(/\D/g, "");
function cpfOk(c){
  c = soDig(c); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  const dv = n => { let s = 0; for (let i = 0; i < n; i++) s += +c[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === +c[9] && dv(10) === +c[10];
}
function cnpjOk(c){
  c = soDig(c); if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const dv = n => { const pesos = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let s = 0; for (let i = 0; i < n; i++) s += +c[i] * pesos[i]; const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dv(12) === +c[12] && dv(13) === +c[13];
}
const fmtCpf = c => c.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
const fmtCnpj = c => c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
const partesDoc = t => String(t || "").split(/[;,\n]+|\s{2,}|\s+e\s+/).map(x => x.trim()).filter(x => soDig(x).length);
function validarDocs(t){
  const erros = [];
  for (const p of partesDoc(t)) {
    const d = soDig(p);
    if (d.length === 11) { if (!cpfOk(d)) erros.push(`${p}: CPF com dígito verificador errado`); }
    else if (d.length === 14) { if (!cnpjOk(d)) erros.push(`${p}: CNPJ com dígito verificador errado`); }
    else erros.push(`${p}: tem ${d.length} dígitos (CPF tem 11, CNPJ tem 14)`);
  }
  return {ok: !erros.length, msg: erros.join(" · "), erros};
}
function formatarDocs(t){
  return partesDoc(t).map(p => { const d = soDig(p); return d.length === 11 ? fmtCpf(d) : d.length === 14 ? fmtCnpj(d) : p; }).join("; ");
}

/* ---------- Pendências de cadastro ---------- */
function pendenciasDe(d){
  if (!d || d.exemplo) return [];
  const p = [];
  if (!(d.servicos || []).length) p.push({k: "servico", t: "Serviço"});
  if (!String(d.municipio || "").trim()) p.push({k: "municipio", t: "Município"});
  if (!telefone(d.contato)) p.push({k: "contato", t: "Telefone"});
  if (!String(d.documento || "").trim()) p.push({k: "documento", t: "CPF/CNPJ"});
  else if (!validarDocs(d.documento).ok) p.push({k: "documento", t: "CPF/CNPJ inválido", grave: true});
  if (ATIVAS.includes(d.etapa) && d.etapa !== "Orçamento" && !d.prazo) p.push({k: "prazo", t: "Prazo"});
  if (!String(d.imovel || "").trim() && (d.servicos || []).some(s => /georref|desmembr|retific|usucap|unific|car\b/i.test(s))) p.push({k: "imovel", t: "Imóvel/matrícula"});
  return p;
}

function pendenciasBanner(d){

function baixarBlob(blob, nome){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
let jszipP = null;
const carregarJSZip = () => jszipP || (jszipP = new Promise((ok, falha) => { if (window.JSZip) return ok(window.JSZip); const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload = () => ok(window.JSZip); s.onerror = () => { jszipP = null; falha(new Error("Não foi possível carregar o compactador. Verifique a internet.")); }; document.head.appendChild(s); }));
async function backupCompleto(btn){
  const prog = t => { const el = $("#bkp-prog"); if (el) el.textContent = t; };
  btn.disabled = true;
  try {
    prog("Gerando cópia atualizada dos dados…");
    const id = await S.user.fazerBackup(); const dados = await S.user.backupDados(id);
    const JSZip = await carregarJSZip(); const zip = new JSZip();
    const dia = hoje();
    zip.file("dados.json", JSON.stringify(dados, null, 1));
    zip.file("LEIA-ME.txt", `Backup completo da Gestão Saotech · ${new Date().toLocaleString("pt-BR")}\n\n- dados.json: demandas, conversas, agenda, portal, equipe e lixeira.\n- arquivos/: todos os anexos e fotos, na mesma organização de pastas do sistema.\n\nGuarde este arquivo em local seguro (HD externo ou Google Drive da empresa). Para restaurar, fale com quem administra o sistema.`);
    const arqs = (dados.arquivos || []).filter(a => a.nome && !a.nome.endsWith("/.emptyFolderPlaceholder"));
    let ok = 0, falhas = 0;

      try { zip.file("arquivos/" + a.nome, await S.user.baixarArquivo(a.nome)); ok++; } catch { falhas++; }
    }
    prog("Compactando…");
    const blob = await zip.generateAsync({type: "blob", compression: "DEFLATE", compressionOptions: {level: 5}});
    baixarBlob(blob, `backup-saotech-${dia}.zip`);
    prog(`Pronto: ${dados.docs?.length || 0} registros e ${ok} arquivo(s)${falhas ? ` · ${falhas} não puderam ser baixados` : ""} · ${tamTxt(blob.size)}.`);
    S.backups = null; carregarBackups();
  } catch (err) { prog("Não foi possível gerar o backup: " + (err.message || err)); }
  btn.disabled = false;
}

/* ---------- Funil comercial e avaliações (Produtividade) ---------- */
const ORDEM_FUNIL = ["Orçamento", "Aguardando entrada", "Campo", "Escritório", "Protocolo", "Entregue", "Concluída"];
function passagens(d){
  // [{etapa, de, ate}] a partir do histórico
  const hs = [...(d.historico || [])].sort((a, b) => a.em < b.em ? -1 : 1);
  const out = []; let atual = null;
  const ini = hs.find(h => /^criou a demanda/.test(h.txt))?.em || d.criadoEm || hs[0]?.em;
  if (ini) atual = {etapa: "Orçamento", de: ini};
  for (const h of hs) {
    const m = /^moveu de (.+) para (.+)$/.exec(h.txt); if (!m) continue;
    if (atual) { atual.etapa = atual.etapa || m[1]; if (atual.etapa !== m[1]) atual.etapa = m[1]; out.push({...atual, ate: h.em}); }
    atual = {etapa: m[2], de: h.em};
  }
  if (atual) out.push({...atual, ate: null});
  return out;
}
const diasEntre = (a, b) => Math.max(0, (new Date(b || Date.now()) - new Date(a)) / 864e5);
function funilHtml(){
  const per = S.funilDias || 365;
  const lim = per === 9999 ? "" : new Date(Date.now() - per * 864e5).toISOString();
  const ds = S.demandas.filter(d => !d.exemplo && (!lim || (d.criadoEm || "") >= lim));
  const alcancou = (d, etapa) => { const i = ORDEM_FUNIL.indexOf(etapa); return ORDEM_FUNIL.indexOf(d.etapa) >= i || passagens(d).some(p => ORDEM_FUNIL.indexOf(p.etapa) >= i); };
  const contratos = ds.filter(d => alcancou(d, "Aguardando entrada"));
  const emOrc = ds.filter(d => d.etapa === "Orçamento");
  const perdidos = ds.filter(d => d.etapa === "Pausada" && !alcancou(d, "Aguardando entrada"));
  const taxa = ds.length ? Math.round(contratos.length / ds.length * 100) : 0;
  const barras = ORDEM_FUNIL.map(e => ({e, n: ds.filter(d => alcancou(d, e)).length}));
  const maxB = Math.max(1, ...barras.map(b => b.n));
  // tempo médio por etapa (só passagens concluídas)
  const tempos = {}; ORDEM_FUNIL.forEach(e => tempos[e] = []);
  S.demandas.filter(d => !d.exemplo).forEach(d => passagens(d).forEach(p => { if (p.ate && tempos[p.etapa]) tempos[p.etapa].push(diasEntre(p.de, p.ate)); }));
  const media = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const medias = ORDEM_FUNIL.slice(0, -1).map(e => ({e, m: media(tempos[e]), n: tempos[e].length}));

  return `<div class="card funil" style="margin-top:16px">
    <div class="card-h"><div><span class="label">Gestão e crescimento</span><h3>Funil comercial</h3></div>
      <select id="funil-dias" aria-label="Período">${[[90, "Últimos 90 dias"], [180, "Últimos 6 meses"], [365, "Últimos 12 meses"], [9999, "Desde o início"]].map(([v, t]) => `<option value="${v}" ${per === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="pstats" style="margin:4px 0 14px">
      <div class="pst"><span class="label">Orçamentos</span><b>${ds.length}</b><span class="sub">entraram no período</span></div>
      <div class="pst ok"><span class="label">Viraram contrato</span><b>${contratos.length}</b><span class="sub">${taxa}% de conversão</span></div>
      <div class="pst ${emOrc.length ? "warn" : ""}"><span class="label">Ainda em orçamento</span><b>${emOrc.length}</b><span class="sub">aguardando resposta</span></div>
      <div class="pst"><span class="label">Pausados sem fechar</span><b>${perdidos.length}</b><span class="sub">orçamentos parados</span></div>
    </div>
    <div class="cols-3-2">
      <div><div class="label" style="margin-bottom:8px">Quantos chegaram a cada etapa</div>
        ${barras.map(b => `<div class="fbar"><span>${esc(b.e)}</span><div><i style="width:${Math.round(b.n / maxB * 100)}%"></i></div><b>${b.n}</b></div>`).join("")}</div>
      <div><div class="label" style="margin-bottom:8px">Tempo médio em cada etapa</div>
        ${medias.map(x => `<div class="fbar t"><span>${esc(x.e)}</span><div><i style="width:${x.m ? Math.max(4, Math.round(x.m / maxM * 100)) : 0}%"></i></div><b>${fmtD(x.m)}</b></div>`).join("")}
        <p class="sub" style="margin:6px 0 0">Calculado pelas mudanças de etapa registradas. Processos importados do Trello começam a contar a partir da importação.</p></div>
    </div>
    <div class="label" style="margin:16px 0 8px">Onde os processos travam${gargalo ? ` · gargalo atual: <b>${esc(gargalo[0])}</b>` : ""}</div>
    ${travados.length ? travados.slice(0, 8).map(x => `<div class="lix-row"><span class="chip">${esc(x.d.etapa)}</span><div class="grow"><a href="#" data-proc="${x.d.id}"><b>${esc(x.d.cliente)}</b></a><div class="sub">${esc(x.d.codigo)} · ${esc(pessoa(x.d.responsavel).nome)}</div></div><span class="lix-dias crit-t">${fmtD(x.dias)}</span></div>`).join("")
      : `<p class="muted" style="margin:0">Nenhum processo parado além do normal. 👍</p>`}
  </div>`;
}

const UF_CAMADAS = () => ls.get("sao.ufCamadas", "es");
function camadasOficiais(L, m){
  const uf = UF_CAMADAS();
  const wms = (url, layer, attr) => L.tileLayer.wms(url, {layers: layer, format: "image/png", transparent: true, version: "1.1.1", opacity: .75, maxZoom: 19, attribution: attr});
  const ov = {
    "SIGEF · imóveis certificados": wms(`https://acervofundiario.incra.gov.br/i3geo/ogc.php?tema=certificada_sigef_particular_${uf}`, `certificada_sigef_particular_${uf}`, "INCRA/SIGEF"),
    "SNCI · certificados antigos": wms(`https://acervofundiario.incra.gov.br/i3geo/ogc.php?tema=imoveiscertificados_privado_${uf}`, `imoveiscertificados_privado_${uf}`, "INCRA/SNCI"),
    "CAR · imóveis (SICAR)": wms("https://geoserver.car.gov.br/geoserver/sicar/wms", `sicar:sicar_imoveis_${uf}`, "SICAR")
  };
  const ativas = ls.get("sao.camadas", []);
  for (const [nome, lyr] of Object.entries(ov)) {
    if (ativas.includes(nome)) lyr.addTo(m);
    if (/INCRA/.test(lyr.options.attribution)) { let erros = 0; lyr.on("tileerror", () => { if (++erros === 4 && !S._avisoIncra) { S._avisoIncra = true; toast("O servidor do INCRA (SIGEF/SNCI) não está respondendo agora. Tente mais tarde ou consulte em sigef.incra.gov.br."); } }); }
  }
  m.on("overlayadd overlayremove", e => { const set = new Set(ls.get("sao.camadas", [])); e.type === "overlayadd" ? set.add(e.name) : set.delete(e.name); ls.set("sao.camadas", [...set]); });
  return ov;
}
let turfP = null;
const carregarTurf = () => turfP || (turfP = new Promise((ok, falha) => { if (window.turf) return ok(window.turf); const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"; s.onload = () => ok(window.turf); s.onerror = () => { turfP = null; falha(new Error("biblioteca de geometria indisponível")); }; document.head.appendChild(s); }));
async function consultarSobreposicao(id, btn){
  const d = S.demandas.find(x => x.id === id); const vv = d && verticesDe(d); if (!vv) return;
  btn.disabled = true; const txt0 = btn.textContent; btn.textContent = "Consultando bases oficiais…";
  try {
    const turf = await carregarTurf();
    const anel = [...vv.vs, vv.vs[0]].map(v => [v.lng, v.lat]);
    const meu = turf.polygon([anel]); const meuM2 = turf.area(meu);
    const [x1, y1, x2, y2] = turf.bbox(meu); const mg = 0.004;
    const bbox = [x1 - mg, y1 - mg, x2 + mg, y2 + mg];
    const uf = UF_CAMADAS(); const itens = [], feats = [], falhas = [];
    for (const fonte of ["car", "sigef", "snci"]) {
      let r; try { r = await S.user.geoConsulta(fonte, uf, bbox); } catch (e) { falhas.push(`${fonte.toUpperCase()}: ${e.message || e}`); continue; }
      if (r?.erro && !(r.features || []).length) { falhas.push(`${fonte.toUpperCase()}: ${r.erro}`); continue; }
      for (const f of r.features || []) {
        if (!f.geometry) continue;
        let inter = 0; try { const x = turf.intersect(meu, f); inter = x ? turf.area(x) : 0; } catch {}
        const toque = (() => { try { return turf.booleanIntersects(meu, f); } catch { return false; } })();

        const cod = p.cod_imovel || p.codigo_imo || p.parcela_co || p.cod_imovel_ || p.nome_area || p.codigo || f.id || "";
        const area = p.area || p.num_area || p.area_ha || (turf.area(f) / 10000);
        itens.push({fonte, cod: String(cod), nome: p.nome_area || p.denominaca || p.nome || "", area: +Number(area).toFixed(4), sobrepM2: +inter.toFixed(1), pct: meuM2 ? +(inter / meuM2 * 100).toFixed(2) : 0, vizinho: toque, municipio: p.municipio || "", condicao: p.condicao || p.situacao_i || p.status_imovel || ""});
        feats.push({...f, properties: {...p, _fonte: fonte, _sobrep: inter}});
      }
    }
    itens.sort((a, b) => b.sobrepM2 - a.sobrepM2 || (b.vizinho - a.vizinho));
    S.geoViz = {...(S.geoViz || {}), [id]: {em: agoraISO(), fc: {type: "FeatureCollection", features: feats}}};
    const consulta = {em: agoraISO(), por: S.me, uf, itens: itens.slice(0, 40), falhas};
    const atual = S.demandas.find(x => x.id === id) || d;
    const sob = itens.filter(i => i.sobrepM2 > 1);
    await S.db.doc("demandas/" + id).update({geo: {...(atual.geo || {}), consulta}, historico: histAdd(atual, `consultou CAR/SIGEF: ${sob.length ? sob.length + " sobreposição(ões)" : "sem sobreposição"}, ${itens.filter(i => i.vizinho && i.sobrepM2 <= 1).length} vizinho(s)`)});
    toast(sob.length ? `Atenção: ${sob.length} sobreposição(ões) encontrada(s)` : "Nenhuma sobreposição encontrada");
  } catch (err) { toast("Não foi possível consultar: " + (err.message || err)); }
  btn.disabled = false; btn.textContent = txt0;
}

const urlAgenda = tok => `${String(window.SAOTECH_CONFIG?.supabaseUrl || "").replace(/\/+$/, "")}/functions/v1/agenda-ics?t=${tok}`;
async function abrirGoogleAgenda(){
  if (S.dlg) (S.dlg.unsubs || []).forEach(u => { try { u(); } catch {} });
  S.dlg = {tipo: "gagenda", unsubs: []};
  const dlg = $("#dlg"); dlg.className = "";
  dlg.innerHTML = `<div class="dlg-h"><div><span class="label">Sincronização</span><h2 style="font-size:19px">Agenda no Google Agenda</h2></div><button type="button" class="btn ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="dlg-b" id="ga-b"><p class="muted">Gerando seu link pessoal…</p></div>
    <div class="dlg-f"><button type="button" class="btn ghost" id="ga-novo" title="Use se o link vazou: o antigo para de funcionar">Gerar novo link</button><button type="button" class="btn" data-close>Fechar</button></div>`;
  if (!dlg.open) dlg.showModal();
  const montar = async novo => {
    try {
      const tok = await S.user.linkAgenda(novo); const url = urlAgenda(tok);
      $("#ga-b").innerHTML = `<p style="margin-top:0">Assine sua agenda da Saotech no Google Agenda: suas saídas de campo, reuniões e os prazos das suas demandas aparecem lá, com lembrete no celular.</p>
        <label class="f">Seu link pessoal (não compartilhe)<div class="ga-link"><input id="ga-url" readonly value="${esc(url)}"><button type="button" class="btn sm primary" id="ga-copiar">Copiar</button></div></label>
        <ol class="ga-passos"><li>Toque em <b>Copiar</b>.</li><li>Abra o <a href="https://calendar.google.com/calendar/u/0/r/settings/addbyurl" target="_blank" rel="noopener">Google Agenda → Adicionar agenda → Por URL</a> (pelo computador).</li><li>Cole o link e confirme. Pronto: a agenda "Saotech" aparece também no celular.</li></ol>
        <p class="sub">iPhone/Outlook: <a href="${esc(url.replace(/^https:/, "webcal:"))}">toque aqui para assinar</a>. O Google atualiza agendas assinadas a cada algumas horas; para algo urgente, use o botão "Google Agenda" dentro do compromisso.</p>`;
      $("#ga-copiar").addEventListener("click", async () => { try { await navigator.clipboard.writeText(url); toast("Link copiado"); } catch { $("#ga-url").select(); } });
    } catch (err) { $("#ga-b").innerHTML = `<p class="banner">Não foi possível gerar o link: ${esc(err.message || "")}</p>`; }
  };
  montar(false);
  $("#ga-novo").addEventListener("click", e => { if (e.target.dataset.ok !== "1") { e.target.dataset.ok = "1"; e.target.textContent = "Confirmar: o link antigo para de funcionar"; return; } e.target.dataset.ok = ""; e.target.textContent = "Gerar novo link"; montar(true); });
}
function gcalLink(a){
  const d = S.demandas.find(x => x.id === a.demandaId);
  const tit = (a.titulo || a.tipo || "Compromisso") + (d ? " · " + d.cliente.split(/\s+[—–]\s+/)[0] : "");
  const fmt = (dia, hh) => dia.replace(/-/g, "") + (hh ? "T" + hh.replace(":", "").padEnd(4, "0") + "00" : "");
  let datas;
  if (a.inicio && prazoEv(a) <= a.data) { const [h, mi] = a.inicio.split(":").map(Number); const fimMin = h * 60 + mi + (/reuni/i.test(a.tipo) ? 60 : 120); datas = `${fmt(a.data, a.inicio)}/${fmt(a.data, String(Math.floor(fimMin / 60) % 24).padStart(2, "0") + ":" + String(fimMin % 60).padStart(2, "0"))}`; }
  else datas = `${fmt(a.data)}/${fmt(addDias(prazoEv(a), 1))}`;
  const det = [a.tipo, d ? `${d.codigo} · ${d.cliente}` : "", d?.contato ? "Contato: " + d.contato : "", a.obs || ""].filter(Boolean).join("\n");
  const conv = (a.pessoas || []).map(p => S.config?.emails?.[p]).filter(Boolean).join(",");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(tit)}&dates=${datas}&ctz=America/Sao_Paulo&details=${encodeURIComponent(det)}&location=${encodeURIComponent(a.local || d?.municipio || "")}${conv ? "&add=" + encodeURIComponent(conv) : ""}`;
}

  if (a && f && !f.querySelector(".gcal-btn")) f.insertAdjacentHTML("afterbegin", `<a class="btn sm gcal-btn" href="${esc(gcalLink(a))}" target="_blank" rel="noopener">Google Agenda</a>`);
};

function abrirPix(id, pid){

  const dlg = $("#dlg"); dlg.className = "";

  dlg.innerHTML = `<div class="dlg-h"><div><span class="label">${esc(d.codigo)} · ${esc(p.rotulo)}</span><h2 style="font-size:19px">Pix de ${brl(p.valor)}</h2></div><button type="button" class="btn ghost" data-close aria-label="Fechar">✕</button></div>

      <p class="sub">Recebedor: ${esc(S.pix.nome)} · chave ${esc(S.pix.chave)}</p></div>

  if (!dlg.open) dlg.showModal();
  window.SaotechPix.preencherQR(dlg);
  $("#pix-copiar").addEventListener("click", async () => { try { await navigator.clipboard.writeText(cod); toast("Código Pix copiado"); } catch { $("#pix-cod").select(); } });
}
const _parcelaRowHtmlAlt = parcelaRowHtml;

/* ---------- Proposta comercial com aceite online ---------- */
const STATUS_PROP = {rascunho: ["Rascunho", ""], enviada: ["Aguardando o cliente", "warn"], aceita: ["Aceita", "ok"], recusada: ["Pediu ajuste", "crit"]};
const INCLUI_PADRAO = {
  "Georreferenciamento SIGEF": "Levantamento de campo com GNSS RTK/estático; processamento e ajustamento; planta e memorial descritivo; planilha ODS e certificação no SIGEF/INCRA.",
  "CAR": "Levantamento das áreas (APP, reserva legal, uso do solo); elaboração e envio do Cadastro Ambiental Rural; recibo de inscrição.",
  "Levantamento topográfico": "Levantamento planialtimétrico; processamento; planta topográfica em DWG/PDF."

function propostaCardHtml(d){

    ${pr.status === "aceita" && pr.aceite ? `<p class="sub" style="margin:0 0 8px">Aceita por <b>${esc(pr.aceite.nome)}</b> em ${fmtQuando(pr.aceite.em)}${pr.aceite.ip ? " · IP " + esc(pr.aceite.ip) : ""}.</p>` : ""}

    ${pr.status === "enviada" ? `<p class="sub" style="margin:0 0 8px">Enviada em ${fmtQuando(pr.enviadaEm)}${pr.validade ? ` · válida até ${fmtData(pr.validade)}` : ""}.${acesso ? "" : " O cliente ainda não tem acesso ao portal."}</p>` : ""}

      <button type="button" class="btn sm" data-proposta="${d.id}">${pr.status === "rascunho" ? "Editar" : "Nova versão"}</button>
      ${pr.status === "rascunho" && acesso ? `<button type="button" class="btn sm primary" data-propenviar="${d.id}">Enviar ao portal</button>` : ""}
      ${pr.status === "aceita" && !(f.parcelas || []).length ? `<button type="button" class="btn sm lima" data-propcontrato="${d.id}">Gerar contrato e parcelas</button>` : ""}
    </div></div>`;

function abrirProposta(id){
  const d = S.demandas.find(x => x.id === id); if (!d || !S.podeFin) return;
  const f = S.fin[id] || {}; const ant = f.proposta;
  const nova = !ant || ant.status !== "rascunho";
  const n = (f.propostasAnteriores || []).length + (ant ? (nova ? 2 : 1) : 1);
  const pr = nova ? {
    numero: `${(d.codigo || "").replace("SAO-", "")}-P${n}`, status: "rascunho", criadaEm: agoraISO(),
    itens: ant?.itens?.map(i => ({...i})) || (d.servicos?.length ? d.servicos : ["Serviço técnico"]).map(s => ({desc: s, valor: null})),
    apresentacao: ant?.apresentacao ?? `Atendendo à sua solicitação, apresentamos a proposta para os serviços técnicos abaixo${d.imovel || (d.cliente || "").includes("—") ? ` no imóvel ${(d.imovel || d.cliente.split(/\s+[—–]\s+/)[1])}` : ""}.`,
    inclui: ant?.inclui ?? (d.servicos || []).map(s => INCLUI_PADRAO[s]).filter(Boolean).join("\n"),
    pagamento: {...(ant?.pagamento || {modo: "Entrada + parcelas", entrada: null, n: 2})}, prazoDias: ant?.prazoDias ?? 60, validade: addDias(hoje(), 15), obs: ant?.obs ?? "Não inclui taxas de cartório, ITR, CCIR e emolumentos de órgãos públicos."
  } : JSON.parse(JSON.stringify(ant));
  if (S.dlg) (S.dlg.unsubs || []).forEach(u => { try { u(); } catch {} });
  S.dlg = {tipo: "proposta", id, unsubs: [], pr};
  const dlg = $("#dlg"); dlg.className = "big";
  const itensHtml = () => pr.itens.map((i, k) => `<div class="prop-item"><textarea data-pi="${k}" data-pk="desc" rows="2" aria-label="Descrição">${esc(i.desc)}</textarea><input data-pi="${k}" data-pk="valor" inputmode="decimal" placeholder="0,00" value="${esc(fmtNum(i.valor))}" aria-label="Valor"><button type="button" class="btn sm ghost" data-pirm="${k}" aria-label="Remover item">✕</button></div>`).join("");
  const total = () => Math.round(pr.itens.reduce((s, i) => s + (i.valor || 0), 0) * 100) / 100;
  dlg.innerHTML = `<div class="dlg-h"><div><span class="label">${esc(d.codigo)} · proposta ${esc(pr.numero)}${nova && ant ? " (nova versão)" : ""}</span><h2 style="font-size:19px">${esc(d.cliente)}</h2></div><button type="button" class="btn ghost" data-close aria-label="Fechar">✕</button></div>
    <form id="fProp" class="dlg-b" autocomplete="off">
      <label class="f">Apresentação<textarea id="pp-apres" rows="2">${esc(pr.apresentacao || "")}</textarea></label>
      <div class="label" style="margin:12px 0 6px">Serviços e valores</div>
      <div id="pp-itens">${itensHtml()}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><button type="button" class="btn sm ghost" id="pp-add">+ Item</button><b id="pp-total">Total ${brl(total())}</b></div>
      <label class="f" style="margin-top:12px">O que está incluído<textarea id="pp-inclui" rows="3">${esc(pr.inclui || "")}</textarea></label>
      <div class="fgrid" style="margin-top:12px">
        <label class="f span2">Forma de pagamento<select id="pp-modo">${MODOS.map(m => `<option ${pr.pagamento.modo === m ? "selected" : ""}>${m}</option>`).join("")}</select></label>
        <label class="f span2">Entrada (R$)<input id="pp-ent" inputmode="decimal" value="${esc(fmtNum(pr.pagamento.entrada))}"></label>
        <label class="f span2">Nº de parcelas<input id="pp-n" type="number" min="1" max="60" value="${esc(pr.pagamento.n || 1)}"></label>
        <label class="f span6">Condições (texto que aparece na proposta, opcional)<input id="pp-cond" value="${esc(pr.pagamento.texto || "")}" placeholder="Ex.: 40% na assinatura e saldo em 2 parcelas mensais via Pix"></label>
        <label class="f span2">Prazo de execução (dias)<input id="pp-prazo" type="number" min="1" value="${esc(pr.prazoDias || "")}"></label>
        <label class="f span2">Válida até<input id="pp-val" type="date" value="${esc(pr.validade || "")}"></label>
      </div>
      <label class="f" style="margin-top:12px">Observações<textarea id="pp-obs" rows="2">${esc(pr.obs || "")}</textarea></label>
      <label class="f" style="margin-top:12px">Notas internas (não aparecem para o cliente)<textarea id="pp-notas" rows="2">${esc(pr.notasInternas || "")}</textarea></label>
    </form>
    <div class="dlg-f"><span class="sub">Só Moisés Bruno vê valores e propostas.</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="pp-pdf">Ver PDF</button><button type="button" class="btn" id="pp-salvar">Salvar rascunho</button>${acessoDe(id) ? `<button type="button" class="btn primary" id="pp-enviar">Salvar e enviar ao portal</button>` : `<button type="button" class="btn primary" id="pp-salvar2">Salvar</button>`}</div></div>`;
  if (!dlg.open) dlg.showModal();
  const ler = () => {
    pr.apresentacao = $("#pp-apres").value.trim(); pr.inclui = $("#pp-inclui").value.trim(); pr.obs = $("#pp-obs").value.trim(); pr.notasInternas = $("#pp-notas").value.trim();
    pr.pagamento = {modo: $("#pp-modo").value, entrada: numBR($("#pp-ent").value), n: +$("#pp-n").value || 1, texto: $("#pp-cond").value.trim()};
    pr.prazoDias = +$("#pp-prazo").value || null; pr.validade = $("#pp-val").value || null;
    pr.itens = pr.itens.filter((i, k) => k < pr.itens.length); pr.total = total(); pr.emitidaEm = pr.emitidaEm || agoraISO();
  };
  dlg.querySelector("#pp-itens").addEventListener("input", e => { const k = e.target.dataset.pi; if (k == null) return; pr.itens[k][e.target.dataset.pk] = e.target.dataset.pk === "valor" ? numBR(e.target.value) : e.target.value; $("#pp-total").textContent = "Total " + brl(total()); });
  dlg.querySelector("#pp-itens").addEventListener("click", e => { const r = e.target.closest("[data-pirm]"); if (!r) return; pr.itens.splice(+r.dataset.pirm, 1); $("#pp-itens").innerHTML = itensHtml(); $("#pp-total").textContent = "Total " + brl(total()); });
  $("#pp-add").addEventListener("click", () => { pr.itens.push({desc: "", valor: null}); $("#pp-itens").innerHTML = itensHtml(); });
  $("#pp-pdf").addEventListener("click", () => { ler(); window.SaotechDoc.imprimir("Proposta " + pr.numero, window.SaotechDoc.propostaHtml(pr, d, logoSrc())); });
  const salvar = async enviar => {
    ler();
    if (!pr.itens.length || pr.itens.some(i => !String(i.desc).trim())) { toast("Preencha a descrição de todos os itens."); return; }
    if (!pr.total) { toast("Informe os valores dos serviços."); return; }
    const atual = S.fin[id] || {};
    const corpo = {...atual};
    if (nova && ant) corpo.propostasAnteriores = [...(atual.propostasAnteriores || []), ant].slice(-10);
    corpo.proposta = {...pr, ...(enviar ? {status: "enviada", enviadaEm: agoraISO(), enviadaPor: S.me} : {})};
    try {
      await salvarFin(id, corpo, enviar ? `enviou a proposta ${pr.numero} (${brl(pr.total)}) ao portal` : `salvou a proposta ${pr.numero}`);
      if (enviar) { const a = acessoDe(id); if (a) await S.user.responderCliente(a.usuario, `📄 Enviamos a proposta ${pr.numero} para o seu serviço (${brl(pr.total)}). Veja os detalhes e aceite aqui no portal, na seção "Proposta".`).catch(() => {}); }
      fecharDlg(); toast(enviar ? "Proposta enviada ao portal do cliente" : "Proposta salva");
    } catch (err) { falhaEscrita(err); }
  };
  $("#pp-salvar").addEventListener("click", () => salvar(false));
  $("#pp-salvar2")?.addEventListener("click", () => salvar(false));
  $("#pp-enviar")?.addEventListener("click", () => salvar(true));
}
document.addEventListener("click", async e => {
  const t = e.target;

            matricula: g("matricula"), ccir: g("ccir"), car: g("car").toUpperCase(), itr: fmtNirf(g("itr")), indicacao: g("indicacao")};
        });

      }
    } catch (err) { falhaEscrita(err); btn.disabled = false; btn.textContent = c ? "Salvar cadastro" : "Cadastrar cliente"; }
  });
}
async function criarClienteComPropriedades(dados, imoveis, docs, clienteExistente){
  const cref = clienteExistente ? S.db.doc("clientes/" + clienteExistente.id) : S.db.collection("clientes").doc();
  if (!clienteExistente) await cref.set({...dados, criadoEm: agoraISO(), criadoPor: S.me});
  const ano = new Date().getFullYear();
  let seq = Math.max(0, ...S.demandas.map(d => +((d.codigo || "").match(new RegExp("SAO-" + ano + "-(\\d+)")) || [])[1] || 0));
  const jaTem = clienteExistente ? propriedadesDe(clienteExistente.id) : [];
  const total = jaTem.length + imoveis.length;
  const ids = [];
  for (const [i, im] of imoveis.entries()) {
    const n = jaTem.length + i + 1;
    const ref = S.db.collection("demandas").doc(); ids.push(ref.id);
    const quando = agoraISO();
    await ref.set({
      codigo: `SAO-${ano}-${String(++seq).padStart(3, "0")}`, cliente: `${dados.nome} — ${nomeCurtoImovel(im, n)}`,
      clienteId: cref.id, propriedadeN: n,
      servicos: [], etapa: "Orçamento", responsavel: S.me, prazo: null,
      contato: dados.telefone, documento: docs, imovel: im.denominacao || "", municipio: im.municipio || "", areaHa: im.areaHa ?? null,
      imovelDados: im, protocoloOrgao: "", protocoloNumero: "", protocoloPrevisao: null, notas: "", checklist: [],
      vinculos: [], historico: [{em: quando, pessoa: S.me, txt: `criou a demanda pelo cadastro do cliente (propriedade ${n} de ${total})`}],
      criadoEm: quando, atualizadoEm: quando, atualizadoPor: S.me
    });
  }
  // vincula todas as propriedades do cliente entre si
  const todas = [...jaTem.map(p => p.id), ...ids];
  if (todas.length > 1) for (const id of todas) {
    const atual = S.demandas.find(x => x.id === id) || (await S.db.doc("demandas/" + id).get()).data() || {};
    const outras = todas.filter(x => x !== id && !(atual.vinculos || []).some(v => v.id === x)).map(x => ({id: x, rel: "Mesmo cliente", obs: "", em: agoraISO(), por: S.me}));
    if (outras.length) await S.db.doc("demandas/" + id).update({vinculos: [...(atual.vinculos || []), ...outras]});
  }
  toast(imoveis.length > 1 ? `Cliente cadastrado com ${imoveis.length} propriedades` : "Cliente cadastrado");
  for (let i = 0; i < 40 && !(S.demandas.some(d => d.id === ids[0]) && S.clientes.some(x => x.id === cref.id)); i++) await new Promise(r => setTimeout(r, 100));
  irProcesso(ids[0]);
  avisarLoginNovoCliente(ids[0]);
  return ids;
}

  f.addEventListener("click", e => { const r = e.target.closest("[data-cfrm]"); if (!r) return; r.closest(".cf-bloco").remove(); renumerar(); const n = f.querySelectorAll(".cf-bloco").length; $("#cf-salvar").textContent = n > 1 ? `Salvar ${n} confrontantes` : "Salvar"; });
  f.addEventListener("change", e => { if (e.target.dataset.k === "existente") e.target.closest(".cf-bloco").querySelector(".cf-dados").hidden = !!e.target.value; });
  const valDocEl = i => { const m = i.parentElement.querySelector(".doc-msg"); const v = i.value.trim(); if (!v) { if (m) m.textContent = ""; return true; } const r = validarDocs(v); if (m) { m.textContent = r.ok ? "válido" : r.msg; m.className = "doc-msg " + (r.ok ? "ok" : "erro"); } return r.ok; };
  f.addEventListener("input", e => { if (["cpf", "conjugeCpf"].includes(e.target.dataset.k)) valDocEl(e.target); });
  f.addEventListener("focusout", e => { const i = e.target, k = i.dataset.k; if (["cpf", "conjugeCpf"].includes(k) && i.value.trim() && validarDocs(i.value).ok) i.value = formatarDocs(i.value); if (k === "telefone") i.value = fmtTel(i.value); if (k === "codigoIR") i.value = fmtCodIR(i.value); });
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const erro = t => { const e = $("#cf-erro"); e.textContent = t; e.hidden = !t; if (t) e.scrollIntoView({block: "center"}); };
    const blocos = [...f.querySelectorAll(".cf-bloco")];
    const planos = [];
    for (const [bi, b] of blocos.entries()) {
      const v = k => (b.querySelector(`[data-k="${k}"]`)?.value || "").trim();
      const sel = [...b.querySelectorAll("[data-cfp]:checked")].map(i => ({demanda: i.dataset.cfp, lado: b.querySelector(`[data-cfl="${i.dataset.cfp}"]`).value, anuencia: b.querySelector(`[data-cfa="${i.dataset.cfp}"]`).value}));
      const rot = blocos.length > 1 ? `Confrontante ${bi + 1}: ` : "";
      const exist = v("existente");
      if (!exist && !v("nome")) { if (blocos.length > 1 && !sel.length) continue; return erro(rot + "informe o nome."); }
      if (!sel.length) return erro(rot + "marque pelo menos uma propriedade com a qual ele confronta.");
      if (!exist && ![...b.querySelectorAll('[data-k="cpf"],[data-k="conjugeCpf"]')].every(valDocEl)) return erro(rot + "confira o CPF/CNPJ.");
      let doc, ref;
      if (exist) {
        const x = S.confrontantes.find(y => y.id === exist); ref = S.db.doc("confrontantes/" + exist);
        doc = {...x, vinculos: [...(x.vinculos || []).filter(y => !sel.some(s => s.demanda === y.demanda)), ...sel], obs: v("obs") || x.obs || ""}; delete doc.id;
      } else {
        ref = c ? S.db.doc("confrontantes/" + c.id) : S.db.collection("confrontantes").doc();
        const propsIds = props.map(p => p.id);
        const fora = (c?.vinculos || []).filter(y => !propsIds.includes(y.demanda));
        doc = {nome: v("nome"), cpf: formatarDocs(v("cpf")), telefone: fmtTel(v("telefone")), endereco: v("endereco"),
          conjuge: v("conjugeNome") || v("conjugeCpf") ? {nome: v("conjugeNome"), cpf: formatarDocs(v("conjugeCpf"))} : null,
          imovel: {denominacao: v("denominacao"), matricula: v("matricula"), codigoIR: fmtCodIR(v("codigoIR")), ccir: v("ccir"), car: v("car").toUpperCase(), sigef: v("sigef")},
          obs: v("obs"), vinculos: [...fora, ...sel], criadoEm: c?.criadoEm || agoraISO(), criadoPor: c?.criadoPor || S.me, atualizadoEm: agoraISO(), atualizadoPor: S.me};
      }
      planos.push({ref, doc, sel});
    }
    if (!planos.length) return erro("Preencha pelo menos um confrontante.");
    erro("");
    const btn = $("#cf-salvar"); btn.disabled = true;
    try {
      for (const {ref, doc, sel} of planos) {
        await ref.set(doc);
        for (const s of sel) { const p = S.demandas.find(y => y.id === s.demanda); if (p && !(c?.vinculos || []).some(y => y.demanda === s.demanda)) await S.db.doc("demandas/" + p.id).update({historico: histAdd(S.demandas.find(y => y.id === s.demanda) || p, `adicionou ${doc.nome} como confrontante${s.lado ? " (" + s.lado + ")" : ""}`)}); }
      }
      fecharDlg(); toast(planos.length > 1 ? `${planos.length} confrontantes salvos` : "Confrontante salvo");
    } catch (err) { falhaEscrita(err); btn.disabled = false; }
  });
  $("#cf-del")?.addEventListener("click", async e => {
    if (e.target.dataset.ok !== "1") { e.target.dataset.ok = "1"; e.target.textContent = "Remover deste processo?"; return; }
    const resto = (c.vinculos || []).filter(v => v.demanda !== demId);
    try {
      if (resto.length) await S.db.doc("confrontantes/" + c.id).update({vinculos: resto});
      else await S.db.doc("confrontantes/" + c.id).delete();
      fecharDlg(); toast(resto.length ? "Removido deste processo" : "Confrontante removido");
    } catch (err) { falhaEscrita(err); }
  });
}
async function abrirListaConfrontantes(){
  if (S.dlg) (S.dlg.unsubs || []).forEach(u => { try { u(); } catch {} });
  S.dlg = {tipo: "listaconf", unsubs: []};
  const dlg = $("#dlg"); dlg.className = "";
  dlg.innerHTML = `<div class="dlg-h"><div><span class="label">Cadastro interno</span><h2 style="font-size:19px">Confrontantes</h2></div><button type="button" class="btn ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="dlg-b"><input id="cfl-busca" type="search" placeholder="Buscar nome, CPF, matrícula ou imóvel" style="width:100%;margin-bottom:10px"><div id="cfl-lista"></div></div>
    <div class="dlg-f"><span class="sub">Para adicionar, abra o processo do cliente e use "+ Confrontante".</span><button type="button" class="btn" data-close>Fechar</button></div>`;
  if (!dlg.open) dlg.showModal();
  const desenhar = () => {
    const q = ($("#cfl-busca").value || "").toLowerCase();
    const l = S.confrontantes.filter(c => !q || [c.nome, c.cpf, c.imovel?.matricula, c.imovel?.denominacao, c.telefone].join(" ").toLowerCase().includes(q)).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    $("#cfl-lista").innerHTML = l.map(c => `<div class="lg-it"><div class="grow"><b>${esc(c.nome)}</b><div class="sub">${[c.cpf, c.telefone, c.imovel?.denominacao, c.imovel?.matricula ? "Mat. " + c.imovel.matricula : ""].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="sub">Confronta: ${(c.vinculos || []).map(v => { const p = S.demandas.find(x => x.id === v.demanda); return p ? `<a href="#" data-proc="${p.id}">${esc((p.cliente || "").split(/\s+[—–]\s+/)[0])} · ${esc(p.imovelDados?.denominacao || p.codigo)}</a>` : ""; }).filter(Boolean).join(", ") || "—"}</div></div></div>`).join("") || `<p class="muted" style="margin:0">Nenhum confrontante cadastrado ainda.</p>`;
  };
  desenhar(); $("#cfl-busca").addEventListener("input", desenhar);
}
document.addEventListener("click", e => {
  const n = e.target.closest("[data-confnovo]"); if (n) { e.stopPropagation(); abrirConfrontante(n.dataset.confnovo); return; }
  const ed = e.target.closest("[data-confedit]"); if (ed) { e.stopPropagation(); const [cid, did] = ed.dataset.confedit.split("|"); abrirConfrontante(did, cid); return; }
  if (e.target.closest("[data-conflista]")) { e.stopPropagation(); abrirListaConfrontantes(); }
}, true);
(function ligarV16(){
  const iv = setInterval(() => { if (!S.db) return; clearInterval(iv);
    S.db.collection("confrontantes").onSnapshot(s => { S.confrontantes = s.docs.map(d => ({id: d.id, ...d.data()})); if (S.tab === "clientes") render(); }, () => {});
  }, 300);
})();

/* ---------- Conexão ---------- */
render();
(async () => {
  const use = n => window.claude?.use?.(n) ?? Promise.resolve(null);
  const [db, user, assets, mcp] = await Promise.all([use("db"), use("user"), use("assets"), use("mcp")]);
  if (!db) { S.erro = "Não foi possível conectar ao banco de dados. Verifique a internet e recarregue a página."; render(); return; }
  S.db = db; S.assets = assets; S.mcp = mcp; S.user = user;
  $("#btnBusca").addEventListener("click", () => abrirBusca()); $("#btnEquipe").addEventListener("click", () => abrirPerfis());
  try { S.podeLimpar = S.finAcesso = !!(user && (user.isOwner() || user.canEdit())); } catch {}
  S.finCol = db.collection("data/fin/demandas");
  try {
    const nome = user ? await user.name() : "";
    const minhaPessoa = user?.pessoa?.();
    if (minhaPessoa && PESSOAS.some(p => p.id === minhaPessoa)) {
      if (!S.finAcesso || !meSalvo) { S.me = minhaPessoa; $("#me").value = minhaPessoa; ls.set("sao.me", S.me); }
      if (!S.finAcesso) { $("#me").disabled = true; $("#me").title = "Você está conectado como " + nome; }
    }
    const norm = t => (t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    if (!meSalvo && nome) { const m = PESSOAS.find(p => norm(nome).includes(norm(p.nome))); if (m) { S.me = m.id; $("#me").value = m.id; } }
    S.contaMoises = minhaPessoa ? minhaPessoa === "moises-bruno" : /moises\s+bruno/.test(norm(nome));
  } catch {}
  try { const w = user?.can?.("data.write"); if (w === false) S.somenteLeitura = true; } catch {}
  if (S.finAcesso && user?.equipe) $("#btnEquipe").hidden = false;
  let prontos = 0; const pronto = () => { if (++prontos >= 2 && !S.conectado) { S.conectado = true; setTimeout(() => mostrarBoasVindas(), 700); } render(); };
  const onErr = err => { if (err.code === "revoked") S.erro = "O acesso a este painel mudou. Recarregue a página."; else S.erro = "A conexão com o banco caiu. Recarregue a página."; render(); };
  db.collection("demandas").onSnapshot(s => { const antes = S.demandas.length; S.demandas = s.docs.map(d => ({id: d.id, ...d.data()})); if (antes && antes !== S.demandas.length) carregarAcessos(); pronto(); }, onErr);
  db.collection("registros").orderBy("data", "desc").limit(800).onSnapshot(s => { S.registros = s.docs.map(d => ({id: d.id, ...d.data()})); pronto(); }, onErr);
  db.collection("mural").orderBy("data", "desc").limit(120).onSnapshot(s => { S.mural = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }, () => {});
  db.collection("agenda").onSnapshot(s => { S.agenda = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }, () => {});
  db.collection("expediente").orderBy("data", "desc").limit(400).onSnapshot(s => { S.expediente = s.docs.map(d => ({id: d.id, ...d.data()})); renderStatus(); if (S.tab === "produtividade") render(); }, () => {});
  db.collection("portal").onSnapshot(s => { S.portais = s.docs.map(d => ({id: d.id, ...d.data()})); renderTabs(); if (["conversas", "clientes", "inicio"].includes(S.tab)) render(); }, () => {});
  carregarAcessos();
  db.doc("config/anotacoes").onSnapshot(s => { S.anotacoes = s.exists ? s.data() : {}; if (S.tab === "inicio" && !S.anotEditando) render(); }, () => {});
  db.doc("config/equipe").onSnapshot(s => { S.config = s.exists ? {emails: {}, ...s.data()} : {emails: {}}; if (S.tab !== "agenda") render(); }, () => {});
  if (S.finAcesso) S.finCol.onSnapshot(s => { S.fin = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); render(); }, () => {});
})();

(() => { const l = document.querySelector(".brand img"); const t = document.getElementById("login-logo"); if (l && t) t.src = l.src; })();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
