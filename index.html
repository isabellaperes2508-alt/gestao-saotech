<script>
/* Endereço antigo (GitHub Pages): assim que o Netlify estiver no ar, leva todo mundo para o endereço novo */
if (/github\.io$/.test(location.hostname)) fetch("https://gestaosaotech.netlify.app/netlify-ok.txt", {cache: "no-store"}).then(r => r.ok && r.text()).then(t => {
  if (t && t.trim() === "ok") location.replace("https://gestaosaotech.netlify.app/" + location.pathname.replace(/^\/gestao-saotech\/?/, "") + location.search + location.hash);
}).catch(() => {});
</script>

header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(251,251,241,.97) 0%,rgba(251,251,241,.9) 50%,rgba(247,247,220,.82) 100%);pointer-events:none}
header.top>*{position:relative}
.brand{display:flex;flex-direction:column;gap:10px}
.brand img{height:44px;width:auto;max-width:100%;display:block}
.brand h1{font-size:15px;font-weight:600;font-family:var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:#5C6B3D}
.brand p{margin:0;color:#656B51;font-size:13px}
.who{display:flex;align-items:center;gap:8px}
.who .label{color:#656B51;white-space:nowrap}
.who select{min-width:170px;background:#FFFFFF;border-color:#D9DBC4;color:#3A3F28}
.who select option{color:#2E3319;background:#F7F7DC}
@media (max-width:520px){.brand img{height:34px}header.top{padding:22px 18px 18px}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:16px 12px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px;margin-block:4px 12px}
.banner.info{background:var(--accent-soft)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:4px 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--crit)}
.kpi.warn .v{color:var(--warn)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* pipeline */
.pipeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.stage{flex:1 0 auto;min-width:108px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;text-align:left}
.stage .n{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stage .t{font-size:12px;color:var(--ink-2);white-space:nowrap}
.stage[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px}
.toolbar select{width:auto}

.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:12px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface)}
.quick .label{margin-right:4px}
.quick #q-cliente{flex:2 1 200px;width:auto}
.quick #q-serv{flex:1 1 180px;width:auto}
details.mais{border-top:1px solid var(--line);padding-top:12px}
details.mais summary{cursor:pointer;font-weight:500;color:var(--ink-2)}
/* list */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rows .row{display:grid;grid-template-columns:120px minmax(0,2.2fr) minmax(0,1.6fr) 130px 140px 118px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.rows .row:first-child{border-top:0}
.rows .row:hover{background:var(--surface-2)}
.rows .row.head{cursor:default;background:transparent;padding-block:10px}
.rows .row.head:hover{background:transparent}
.cli{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.e-orc{color:var(--ink-2)}
.pill.e-ent{color:var(--warn);background:var(--warn-soft)}
.pill.e-cam,.pill.e-esc{color:var(--accent);background:var(--accent-soft)}
.pill.e-pro{color:var(--warn);background:var(--warn-soft)}
.pill.e-ent2,.pill.e-con{color:var(--good);background:var(--good-soft)}
.pill.e-pau{color:var(--muted)}
.due{font-size:12.5px;font-variant-numeric:tabular-nums}
.due.crit{color:var(--crit);font-weight:600}
.due.warn{color:var(--warn);font-weight:600}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .rows .row{grid-template-columns:1fr auto;gap:4px 12px}
  .rows .row.head{display:none}
  .rows .row>.c-cod{grid-column:1/-1;order:-1}
  .rows .row>.c-cli{grid-column:1/2}
  .rows .row>.c-etapa{grid-column:2/3;grid-row:2;justify-self:end}
  .rows .row>.c-serv{grid-column:1/-1}
  .rows .row>.c-resp{grid-column:1/2}
  .rows .row>.c-prazo{grid-column:2/3;justify-self:end}
}

/* grid layouts */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.cols-3-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:860px){.cols,.cols-3-2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:17px;font-weight:600;margin-bottom:12px}
.card h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}

/* form grid */
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2,.span3,.span4{grid-column:span 2}.span1{grid-column:span 1}}

/* activity log */
.day{border-top:1px solid var(--line);padding-block:10px}
.day:first-child{border-top:0}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.day-h b{font-weight:600}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0}
.item .t{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.item .d{font-size:13.5px}
.item .d .sub{display:block}
.item .acts{display:flex;gap:4px}
.st{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
.st.feita{background:var(--good-soft);color:var(--good)}
.st.pend{background:var(--warn-soft);color:var(--warn)}

/* charts */
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:12.5px}
.hbar .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:14px;position:relative}
.hbar .fill{height:100%;background:var(--chart);border-radius:0 4px 4px 0;min-width:2px}
.hbar .val{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:480px){.hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 48px}}
.vbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:170px;border-bottom:1px solid var(--line-2);position:relative}
.vbar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.vbar .fill{width:min(34px,70%);background:var(--chart);border-radius:4px 4px 0 0;min-height:2px}
.vbar .val{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.vlabels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px;font-size:12px;color:var(--muted);text-align:center}
.vbar.max .fill{background:var(--accent)}
.heat{display:grid;grid-template-columns:40px repeat(8,minmax(0,1fr));gap:3px;font-size:11.5px}
.heat .hl{color:var(--muted);display:flex;align-items:center}
.heat .hh{color:var(--muted);text-align:center;font-family:var(--f-mono);font-size:10.5px}
.heat .cell{aspect-ratio:1.6/1;border-radius:4px;background:var(--heat-0);max-width:100%}
.legend-seq{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend-seq i{display:inline-block;width:18px;height:10px;border-radius:2px}

.tips{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;line-height:1.5}
.tips li .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono);background:var(--accent-soft);color:var(--accent)}
.tips li.w .ic{background:var(--warn-soft);color:var(--warn)}

.pend-list{display:flex;flex-direction:column}
.pend-list .p{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.pend-list .p:first-child{border-top:0}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,20,22,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dlg-f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
legend{padding:0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.checks input{width:auto;margin:0;accent-color:var(--accent)}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;z-index:99;max-width:240px;line-height:1.35}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:100}
.muted{color:var(--muted)}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}}
@media (prefers-reduced-motion:no-preference){.stage,.btn,.rows .row{transition:background-color .15s,border-color .15s}}

/* ---------- v2: quadro, conversa, agenda ---------- */
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--crit);color:#fff;font-size:11px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.col-h b{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.col-h span{font-size:12px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;position:relative}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kcard.dragging{opacity:.45}
.kcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kcard .cod{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kcard .cli{font-size:14px;line-height:1.3}
.kcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink-2)}
.kcard .mv{display:flex;gap:4px}
.kcard .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:24px;cursor:pointer;color:var(--ink-2);line-height:1}
.kcard .mv button:hover{border-color:var(--accent);color:var(--accent)}
.dot-new{width:8px;height:8px;border-radius:50%;background:var(--crit);display:inline-block}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:600;flex:none}
.ic{width:14px;height:14px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* dialog com abas */
dialog.big{width:min(880px,calc(100vw - 24px))}
.dtabs{display:flex;gap:2px;overflow-x:auto;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:73px;background:var(--surface);z-index:1}
.dtabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.dtabs button:disabled{opacity:.4;cursor:default}
.pane[hidden]{display:none}

.cl{display:flex;flex-direction:column}
.cl-item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.cl-item:first-child{border-top:0}
.cl-item input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.cl-item.ok .t{color:var(--muted);text-decoration:line-through}
.cl-item .by{font-size:11.5px;color:var(--muted)}
.cl-add{display:flex;gap:8px;margin-top:10px}

/* conversa */
.chat{display:flex;flex-direction:column;gap:10px;max-height:min(56vh,520px);overflow-y:auto;padding:4px 2px}
.chat.full{max-height:none;overflow:visible}
.chat-day{align-self:center;font-size:11.5px;color:var(--muted);background:var(--surface-2);padding:2px 10px;border-radius:999px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:min(560px,92%)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.me .bubble{background:var(--accent-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.bubble .h{font-size:11.5px;color:var(--muted);display:flex;gap:8px}
.bubble .h b{color:var(--ink-2);font-weight:600}
.bubble .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .dem{align-self:flex-start;font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px;background:var(--surface);cursor:pointer;color:var(--accent)}
.atts{display:flex;flex-wrap:wrap;gap:6px}
.atts a.img{display:block;width:120px;height:90px;border-radius:8px;overflow:hidden;background:var(--line)}
.atts a.img img{width:100%;height:100%;object-fit:cover;display:block}
.atts a.file{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line-2);border-radius:8px;padding:5px 9px;background:var(--surface);color:var(--ink);text-decoration:none;max-width:220px}
.atts a.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.composer textarea{min-height:44px;resize:vertical}
.composer .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.composer .row2 select{flex:1 1 200px;width:auto}
.composer .pend{font-size:12px;color:var(--ink-2)}
label.filebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--surface);font-weight:500}
label.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gal a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);font-size:12px}
.gal .th{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-weight:600}
.gal .th img{width:100%;height:100%;object-fit:cover}
.gal .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* mensagens ao cliente */
.tpl{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tpl h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:14.5px}
.tpl textarea{min-height:110px}
.tpl .acts{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}

.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.hist .h:first-child{border-top:0}
.hist .h time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* agenda */
.ag-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ag-nav h2{font-size:18px;margin-right:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:150px;display:flex;flex-direction:column}
.wday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wday .wh{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.wday .wh b{font-family:var(--f-display);font-weight:600}
.wday .wh span{font-size:12px;color:var(--muted)}
.wday .evs{padding:6px;display:flex;flex-direction:column;gap:6px}
.ev{border-radius:8px;padding:6px 8px;background:var(--surface-2);border-left:3px solid var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.ev.t-campo{background:var(--accent-soft);border-left-color:var(--accent)}
.ev.t-prot{background:var(--warn-soft);border-left-color:var(--warn)}
.ev .hr{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:11.5px;display:flex;justify-content:space-between;gap:6px}
.ev .ti{font-weight:600;line-height:1.25}
.ev .ps{display:flex;gap:3px}
.addday{margin:auto 6px 6px;border:1px dashed var(--line-2);background:transparent;border-radius:8px;padding:4px;color:var(--muted);cursor:pointer;font-size:12px}
.addday:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:900px){.week{grid-template-columns:1fr}.wday{min-height:0}}
.gcal-ok{font-size:12px;color:var(--good)}

/* v3: avisos, expediente */
header.top{overflow:visible}
header.top::before{border-radius:16px}
.hdr-acts{display:flex;align-items:center;gap:8px;margin-left:auto;position:relative;flex-wrap:wrap;min-width:0}
.bell{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid #D9DBC4;background:#FFFFFF;color:#3A3F28;cursor:pointer;display:grid;place-items:center}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.bell-n:empty{display:none}
.avisos{position:absolute;right:0;top:48px;z-index:30;width:min(360px,calc(100vw - 48px));background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:8px}
.avisos h4{margin:4px 8px 8px;font-family:var(--f-display);font-size:14.5px}
.aviso{display:flex;justify-content:space-between;gap:10px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px}
.aviso:hover{background:var(--surface-2)}
.btn.dia{background:#FFFFFF;border-color:#D9DBC4;color:#3A3F28}
.btn.dia.on{background:var(--accent);border-color:var(--accent);color:#FBFBF1}
.btn.dia .t{font-variant-numeric:tabular-nums;opacity:.85;font-weight:400}
.alerta-prazo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:var(--crit-soft);margin-block:4px 12px;font-size:13px}
.dia-sec{display:flex;flex-direction:column;gap:6px}
.dia-sec h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:14.5px}
.dia-li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.ev .ate{font-size:11px;color:var(--accent);font-weight:600}

/* v4: blocos escuros em verde musgo */
:root{--musgo:#2E3319;--musgo-2:#3A4022;--musgo-line:#4A5230;--creme:#F7F7DC;--creme-2:#C9CCA8;--lima:#D9E15A}
/* indicadores */
.kpi{background:var(--musgo);border-color:var(--musgo)}
.kpi .label{color:var(--creme-2)}
.kpi .v{color:var(--creme)}
.kpi .s{color:var(--creme-2)}
.kpi.alert .v{color:#F4A48C}
.kpi.warn .v{color:var(--lima)}
.kpi .v input{background:var(--musgo-2);border-color:var(--musgo-line);color:var(--creme);color-scheme:dark}
/* aba ativa */
nav.tabs button[aria-selected="true"]{background:var(--musgo);color:var(--creme);box-shadow:none}
nav.tabs button[aria-selected="true"] .badge{background:var(--lima);color:var(--musgo)}
/* criação rápida */
.quick{background:var(--musgo);border:0}
.quick .label{color:var(--lima)}
.quick input,.quick select{background:var(--musgo-2);border-color:var(--musgo-line);color:var(--creme);color-scheme:dark}
.quick input::placeholder{color:var(--creme-2)}
.quick .btn.primary{background:var(--lima);border-color:var(--lima);color:var(--musgo)}
.quick .btn.ghost{color:var(--creme)}
/* quadro: cabeçalho das colunas */
.col{padding:0;overflow:hidden}
.col-h{background:var(--musgo);padding:10px 12px}
.col-h b{color:var(--creme)}
.col-h span{color:var(--lima);font-weight:600}
.col>.kcard{margin-inline:10px}
.col>.kcard:last-child,.col>.sub:last-child{margin-bottom:10px}
.col>.sub{padding:6px 14px!important}
.seg button[aria-pressed="true"]{background:var(--musgo);color:var(--creme)}
/* cabeçalho das janelas */
.dlg-h{background:var(--musgo);color:var(--creme);border-bottom-color:var(--musgo)}
.dlg-h .label{color:var(--lima)}
.dlg-h h2{color:var(--creme)}
.dlg-h .btn.ghost{color:var(--creme)}
/* agenda: cabeçalho dos dias */
.wday{overflow:hidden}
.wday .wh{background:var(--musgo);border-bottom-color:var(--musgo)}
.wday .wh b{color:var(--creme)}
.wday .wh span{color:var(--lima)}
.wday.today{box-shadow:inset 0 0 0 2px var(--lima);border-color:var(--musgo)}
/* botões de dia e cards de destaque */
.btn.dia.on{background:var(--musgo);border-color:var(--musgo);color:var(--creme)}
.btn.primary{background:var(--musgo);border-color:var(--musgo);color:var(--creme)}
.card h3{padding-bottom:10px;border-bottom:2px solid var(--musgo)}
.msg.me .bubble{background:var(--musgo);color:var(--creme)}
.msg.me .bubble .h,.msg.me .bubble .h b{color:var(--creme-2)}
.msg.me .bubble .dem{background:var(--musgo-2);border-color:var(--musgo-line);color:var(--lima)}
.msg.me .av{background:var(--musgo);color:var(--lima)}

/* v5: boas-vindas, início, clientes, conversas e galeria */
.curvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.curvas path{fill:none;stroke:currentColor;stroke-width:1;vector-effect:non-scaling-stroke}
.btn.lima{background:var(--lima);border-color:var(--lima);color:var(--musgo);font-weight:600}
.btn.lima:hover{filter:brightness(.97)}
/* tela de boas-vindas */
.bv{position:fixed;inset:0;z-index:150;background:var(--creme);color:var(--musgo);display:grid;place-items:center;padding:24px 16px;overflow:auto;animation:bvIn .4s ease-out}
.bv .curvas{color:#5C6B3D;opacity:.2}
.bv-in{position:relative;width:min(580px,100%);display:flex;flex-direction:column;gap:22px}
.bv-in img{height:46px;width:auto;align-self:flex-start}
.bv-in .label{color:var(--accent);font-size:11.5px}
.bv h2{font-family:var(--f-display);font-size:clamp(38px,8vw,60px);line-height:1;margin:10px 0 0;color:var(--musgo);font-weight:700;letter-spacing:-.025em}
.bv p.lead{margin:0;color:var(--ink-2);font-size:15.5px;max-width:46ch}
.bv-card{background:var(--musgo);color:var(--creme);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;box-shadow:0 18px 40px rgba(46,51,25,.18)}
.bv-card div{display:flex;flex-direction:column;gap:4px}
.bv-card b{font-family:var(--f-display);font-size:34px;color:var(--lima);font-weight:600;line-height:1}
.bv-card span{font-size:12px;color:var(--creme-2);line-height:1.3}
.bv-acts{display:flex;gap:10px;flex-wrap:wrap}
.bv-acts .btn{padding:12px 22px;font-size:14.5px}
.bv.saindo{animation:bvOut .25s ease-in forwards}
@keyframes bvIn{from{opacity:0}to{opacity:1}}
@keyframes bvOut{to{opacity:0;transform:scale(.995)}}
@media (prefers-reduced-motion:reduce){.bv,.bv.saindo{animation:none}}
/* início */
.hero{position:relative;overflow:hidden;background:var(--musgo);color:var(--creme);border-radius:16px;padding:26px 24px;margin-block:4px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;align-items:flex-end}
.hero .curvas{color:var(--lima);opacity:.15}
.hero>*:not(.curvas){position:relative}
.hero h2{font-family:var(--f-display);font-size:clamp(28px,4.6vw,40px);margin:6px 0 6px;font-weight:700;letter-spacing:-.02em;color:var(--creme);line-height:1.05}
.hero .label{color:var(--lima)}
.hero p{margin:0;color:var(--creme-2);max-width:58ch;font-size:14px}
.hero .acts,.proc-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .btn:not(.lima),.proc-h .btn:not(.lima){background:transparent;color:var(--creme);border-color:var(--musgo-line)}
.hero .btn:not(.lima):hover,.proc-h .btn:not(.lima):hover{background:var(--musgo-2)}
.mini-pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px}
.mini-pipe button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink-2);font:inherit;font-size:12px;text-align:left}
.mini-pipe button:hover{border-color:var(--accent)}
.mini-pipe b{font-family:var(--f-display);font-size:22px;color:var(--musgo);font-weight:600;line-height:1.1}
@media (max-width:860px){.mini-pipe{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:480px){.mini-pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ini-grid .card.span2{grid-column:span 2}
@media (max-width:760px){.ini-grid{grid-template-columns:1fr}.ini-grid .card.span2{grid-column:auto}}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border:0;border-top:1px solid var(--line);font:inherit;font-size:13px;cursor:pointer;background:none;width:100%;text-align:left;color:inherit}
.card h3+.li,.li:first-child{border-top:0}
.li:hover .t{color:var(--accent)}
.li .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li>.sub,.li>.due,.li>.pill,.li>.nbadge{flex:none}
.chip.eu{background:var(--lima);border-color:var(--lima);color:var(--musgo);font-weight:600}
.nbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--lima);color:var(--musgo);font-size:11px;font-weight:700}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--crit);flex:none}
/* listas laterais (clientes e conversas) */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100dvh - 24px);padding:12px}
.side .lst{overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-inline:-4px;padding-inline:4px}
.side .seg{align-self:flex-start}
.side-it{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit;width:100%}
.side-it:hover{background:var(--surface-2)}
.side-it[aria-current="true"]{background:var(--musgo);color:var(--creme)}
.side-it[aria-current="true"] .sub,.side-it[aria-current="true"] .prev{color:var(--creme-2)}
.side-it[aria-current="true"] .prog{background:var(--musgo-line)}
.side-it[aria-current="true"] .prog i{background:var(--lima)}
.side-it .r1{display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.side-it b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-it .prev{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-it .prog{height:4px;margin-top:2px}
@media (max-width:900px){.split{grid-template-columns:1fr}.side{position:static;max-height:none}.side .lst{max-height:300px}}
/* processo do cliente */
.proc-h{position:relative;overflow:hidden;background:var(--musgo);color:var(--creme);border-radius:16px;padding:22px}
.proc-h .curvas{color:var(--lima);opacity:.14}
.proc-h>*:not(.curvas){position:relative}
.proc-h h2{font-family:var(--f-display);font-size:clamp(22px,3.2vw,30px);margin:6px 0 8px;color:var(--creme);font-weight:700;letter-spacing:-.015em;line-height:1.1}
.proc-h .label{color:var(--lima)}
.proc-h .meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--creme-2)}
.proc-h .meta b{color:var(--creme);font-weight:500}
.proc-h .acts{margin-top:16px}
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;font-size:12px;color:var(--muted);padding-inline:2px}
.step::before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:2px;background:var(--line-2)}
.step:first-child::before{display:none}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);font-weight:600;position:relative;z-index:1;font-size:12.5px;color:var(--muted)}
.step.done{color:var(--ink-2)}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--creme)}
.step.done::before,.step.cur::before{background:var(--accent)}
.step.cur{color:var(--musgo);font-weight:600}
.step.cur .n{background:var(--lima);border-color:var(--musgo);color:var(--musgo);box-shadow:0 0 0 5px rgba(217,225,90,.35)}
.step time{font-size:11px;color:var(--muted);font-weight:400}
@media (max-width:640px){
  .stepper{grid-template-columns:1fr}
  .step{flex-direction:row;text-align:left;gap:12px;padding:6px 0}
  .step::before{top:-50%;bottom:50%;left:14px;right:auto;width:2px;height:auto}
  .step time{margin-left:auto}
}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.pst{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pst b{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--musgo);line-height:1.1}
.pst.warn b{color:var(--warn)} .pst.crit b{color:var(--crit)}
.pst.dark{background:var(--musgo);border-color:var(--musgo)}
.pst.dark .label,.pst.dark .sub{color:var(--creme-2)} .pst.dark b{color:var(--lima)}
.conv-h{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--musgo);margin-bottom:12px;flex-wrap:wrap}
.conv-h h3{border:0!important;padding:0!important;margin:2px 0 0}
.tl{display:flex;flex-direction:column;position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-it{position:relative;padding:8px 0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.tl-it::before{content:"";position:absolute;left:-22px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);box-sizing:border-box}
.tl-it.k-etapa::before{background:var(--accent);border-color:var(--accent)}
.tl-it.k-hist::before{border-color:var(--accent)}
.tl-it.k-msg::before{border-color:var(--chart);background:var(--accent-soft)}
.tl-it.k-agenda::before{background:var(--lima);border-color:var(--musgo)}
.tl-it.futuro{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-left:-6px}
.tl-it.futuro::before{left:-16px}
.tl-it time{font-size:11.5px;color:var(--muted)}
.tl-it .atts a.img{width:84px;height:64px}
.notas a{color:var(--accent);word-break:break-all}
.notas{white-space:pre-wrap;font-size:13px;color:var(--ink-2);max-height:320px;overflow:auto}
/* conversas */
.conv .chatbox{display:flex;flex-direction:column}
.conv .chatbox .chat{height:min(58vh,560px);max-height:none}
.avs{display:flex}
.avs .av{margin-left:-6px;border:2px solid var(--surface)}
/* galeria */
.gal2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gal2.mini{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gal2.mini .nm,.gal2.mini .sub,.gal2.mini .tag{display:none}
.gi{display:flex;flex-direction:column;gap:5px;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;text-decoration:none;min-width:0}
.gi .th{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.gi .th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.gi:hover .th img{transform:scale(1.04)}
.gi .ext{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent);letter-spacing:.04em}
.gi .tag{position:absolute;left:8px;bottom:8px;background:var(--musgo);color:var(--lima);font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:500;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .sub{font-size:11.5px}
.gal-mes{font-family:var(--f-display);font-weight:600;font-size:16px;margin:20px 0 10px;text-transform:capitalize;color:var(--musgo)}
dialog.foto{width:min(1100px,calc(100vw - 24px));background:var(--musgo);color:var(--creme)}
dialog.foto .sub{color:var(--creme-2)}
.lb{position:relative;display:grid;place-items:center;min-height:40vh;background:#1F2310}
.lb img{max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain;display:block}
.lb-nav,.lb-x{position:absolute;border:0;background:rgba(46,51,25,.75);color:var(--creme);width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer;display:grid;place-items:center;line-height:1}
.lb-nav{top:50%;transform:translateY(-50%)}
.lb-nav.prev{left:12px} .lb-nav.next{right:12px}
.lb-x{top:12px;right:12px;font-size:16px}
.lb-nav:hover,.lb-x:hover{background:var(--musgo);color:var(--lima)}
.lb-f{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap;font-size:13px}
.dlg-h .btn.sm{background:transparent;color:var(--creme);border-color:var(--musgo-line)}
.vin{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.vin:first-of-type{border-top:0}
.vin .li{border-top:0;flex:1;min-width:0}
.vin .li .t{white-space:normal}
.chip.rel-conf{background:var(--musgo);border-color:var(--musgo);color:var(--lima)}
.chip.rel-cli{background:var(--accent-soft);color:var(--accent)}
.vin-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.vin-add select,.vin-add input{flex:1 1 160px;width:auto}
a.li{text-decoration:none}
a.li .ic{width:14px;height:14px;vertical-align:-2px}
/* v8: celular — nada pode ficar mais largo que a tela */
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
.wrap{min-width:0}
#view,#view>*{min-width:0;max-width:100%}
@media (max-width:860px){.cols,.cols-3-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.ini-grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card,.panel,.side,.chatbox,.proc,.hero,.proc-h{min-width:0}
.notas,.tx,.li .t,.sub{overflow-wrap:anywhere}
@media (max-width:640px){
  header.top{padding:18px 16px 16px}
  .hero{padding:20px 18px}
  .hero .acts{width:100%}
  .proc-h{padding:18px 16px}
  .card{padding:14px}
  .toolbar{flex-wrap:wrap}
  .toolbar>*{min-width:0}
  .toolbar select,.toolbar input{flex:1 1 100%}
  .quick{flex-wrap:wrap}
  .quick input,.quick select{flex:1 1 100%;min-width:0}
  .li{flex-wrap:wrap}
  .li .t{white-space:normal}
  .conv .chatbox .chat{height:60vh}
  .msg{max-width:100%}
}
/* contrato e pagamentos */
.fin-card{border-top:3px solid var(--musgo)}
.fin-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:6px}
fieldset .fin-sum{grid-template-columns:repeat(3,minmax(0,1fr))}
.fin-sum>div{display:flex;flex-direction:column;gap:2px}
.fin-sum b{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--musgo)}
.ok-t{color:var(--good)!important} .crit-t{color:var(--crit)!important}
.fin-list{display:flex;flex-direction:column}
.fin-row{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.6fr) auto;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.fin-row:first-child{border-top:0}
.fin-row.pago{background:linear-gradient(90deg,var(--good-soft),transparent 70%);margin-inline:-8px;padding-inline:8px;border-radius:8px}
.fin-row .num{font-weight:600;font-variant-numeric:tabular-nums}
.fin-row .acts{justify-self:end}
a.comp{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);text-decoration:underline;margin-top:2px}
a.comp .ic{width:13px;height:13px}
.fin-edit{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fin-edit-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr) 40px;gap:6px;align-items:center}
.fin-edit-row.pago input{background:var(--good-soft)}
.fin-edit>.btn{align-self:flex-start}
.fin-ct{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:8px 16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;font:inherit;color:inherit;cursor:pointer}
.card h3+.fin-ct{border-top:0}
.fin-ct:hover b{color:var(--accent)}
.fin-ct .a,.fin-ct .b,.fin-ct .c{display:flex;flex-direction:column;gap:4px;min-width:0}
.fin-pg{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.card h3+.fin-pg{border-top:0}
.fin-pg>div:last-child{display:flex;flex-direction:column;align-items:flex-end}
@media (max-width:640px){
  .fin-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fin-row{grid-template-columns:minmax(0,1fr) auto}
  .fin-row>div:nth-child(3){grid-column:1/-1}
  .fin-row .acts{grid-column:1/-1;justify-self:stretch}.fin-row .acts .btn{width:100%;justify-content:center}
  .fin-edit-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}
  .fin-edit-row input[data-pk="rotulo"]{grid-column:1/-1}
  .fin-ct{grid-template-columns:minmax(0,1fr)}
  .mini-pipe{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .mini-pipe button{flex:0 0 112px}
}
/* v9 */
.grafico{width:100%;height:auto;display:block}
.grafico .g-rec{fill:var(--musgo)} .grafico .g-prev{fill:#B9C08F} .grafico .g-atr{fill:var(--crit)}
.grafico .g-ax{stroke:var(--line-2)} .grafico .g-sep{stroke:var(--line-2);stroke-dasharray:4 4}
.grafico text{font-family:var(--f-body);fill:var(--ink-2)} .grafico .g-x{font-size:12px;text-anchor:middle} .grafico .g-x.cur{font-weight:700;fill:var(--musgo)}
.grafico .g-v{font-size:10.5px;text-anchor:middle;fill:var(--ink)} .grafico .g-lbl{font-size:10.5px;fill:var(--muted)}
.g-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.g-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.g-leg .g-rec{background:var(--musgo)} .g-leg .g-prev{background:#B9C08F} .g-leg .g-atr{background:var(--crit)} .g-leg .g-conf{background:none;border-top:2px dashed #C9CF3A;height:0;width:14px;border-radius:0}
.fin-pg>div:last-child{gap:4px}
.chk-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.chk-line input{width:auto;accent-color:var(--accent)}
.fin-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* recibo */
.recibo{background:#fff;color:#2E3319;border:1px solid var(--line-2);border-radius:12px;padding:28px 30px;font-size:14px;line-height:1.6;max-width:720px;margin:0 auto}
.rc-top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2E3319;padding-bottom:14px;margin-bottom:16px}
.rc-top img{height:42px}
.rc-t{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.12em;text-align:right}
.rc-n{font-size:12px;color:#656B51;text-align:right}
.rc-valor{font-family:var(--f-display);font-size:30px;font-weight:700;background:#F7F7DC;border-radius:10px;padding:8px 14px;display:inline-block;margin-bottom:12px}
.rc-tab{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.rc-tab td{border-top:1px solid #EAEBDA;padding:7px 4px}.rc-tab td:first-child{color:#656B51;width:42%}
.rc-data{text-align:right;margin-top:18px}
.rc-ass{display:flex;flex-direction:column;align-items:center;margin-top:44px;gap:2px}
.rc-linha{width:260px;max-width:80%;border-top:1px solid #2E3319;margin-bottom:6px}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* login */
#login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:#2E3319;overflow:auto}
#login .box{width:min(400px,100%);background:#FBFBF1;border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#login img.logo{height:40px;width:auto;align-self:flex-start}
#login h1{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-size:20px;margin:0;color:#2E3319}
#login p{margin:0;color:#656B51;font-size:13.5px}
#login form{display:flex;flex-direction:column;gap:12px}
#login-msg{background:#FAF1DF;color:#3A3F28;border-radius:8px;padding:9px 12px;font-size:13px}
#login .link{background:none;border:0;color:#5C6B3D;text-decoration:underline;cursor:pointer;padding:0;font:inherit;font-size:13px;align-self:flex-start}
body.sem-login .wrap{visibility:hidden}
</style>
</head>
<body class="sem-login">
<div id="login" hidden>
  <div class="box">
    <img class="logo" id="login-logo" alt="Saotech Geotecnologia">
    <div><h1>Gestão Saotech</h1><p>Entre com seu usuário (nome.sobrenome) e senha. Clientes usam o usuário que a Saotech enviou.</p></div>
    <div id="login-msg" role="status" hidden></div>
    <form id="f-login" data-modo="entrar">
      <label class="f">Usuário<input id="l-email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nome.sobrenome" required></label>
      <label class="f">Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Entrar</button>
      <button class="link" type="button" id="l-esqueci">Esqueci a senha</button>
    </form>
    <form id="f-nova" data-modo="nova" hidden>
      <label class="f">Nova senha (mínimo 8 caracteres)<input id="n-senha" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary" type="submit">Salvar nova senha</button>
    </form>
  </div>
</div>

<script>
/* Mostra erros inesperados na tela para facilitar o suporte */
(function(){
  function aviso(msg){
    try {
      let el = document.getElementById("erro-tecnico");
      if (!el) { el = document.createElement("div"); el.id = "erro-tecnico"; el.setAttribute("role", "alert");
        el.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:300;background:#FBEDE7;color:#3A3F28;border:1px solid #BC5A3E;border-radius:10px;padding:10px 14px;font:13px/1.4 Poppins,Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.15)";
        document.body.appendChild(el); }
      el.textContent = "Erro técnico (envie um print para o suporte): " + msg;
    } catch {}
  }
  window.addEventListener("error", e => aviso((e.message || "erro") + (e.lineno ? " · linha " + e.lineno : "")));
  window.addEventListener("unhandledrejection", e => aviso(String(e.reason && (e.reason.message || e.reason.code) || e.reason)));
  window.__avisoErro = aviso;
})();
</script>

/* ---------- Cálculos de demandas ---------- */
function prazoInfo(d){
  if (!d.prazo || !ATIVAS.includes(d.etapa)) return {txt: d.prazo ? fmtData(d.prazo) : "—", cls: ""};
  const n = diff(d.prazo, hoje());
  if (n < 0) return {txt: `Vencido há ${-n} d`, cls: "crit", n};
  if (n === 0) return {txt: "Vence hoje", cls: "crit", n};
  if (n <= 7) return {txt: `Em ${n} d · ${fmtData(d.prazo)}`, cls: "warn", n};
  return {txt: fmtData(d.prazo), cls: "", n};
}
function entradaInfo(f){
  if (!f || !f.aceiteEm) return null;
  if (f.entradaPagaEm) return {txt: "Entrada paga " + fmtData(f.entradaPagaEm), cls: "ok"};
  const venc = addDias(f.aceiteEm, 3), n = diff(venc, hoje());
  if (n < 0) return {txt: `Entrada vencida há ${-n} d`, cls: "crit", vencida: true};
  return {txt: n === 0 ? "Entrada vence hoje" : `Entrada vence em ${n} d`, cls: "warn", venc};
}
function proximoCodigo(){
  const ano = new Date().getFullYear();
  const nums = S.demandas.map(d => (d.codigo || "").match(new RegExp("SAO-" + ano + "-(\\d+)"))).filter(Boolean).map(m => +m[1]);
  return `SAO-${ano}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0")}`;
}
const prazoEv = a => a.prazo && a.prazo >= a.data ? a.prazo : a.data;
const proximoCampo = id => S.agenda.filter(a => a.demandaId === id && prazoEv(a) >= hoje()).sort((a, b) => (a.data + a.inicio) < (b.data + b.inicio) ? -1 : 1)[0];
const temNovidade = d => d.ultimaMsg && d.ultimaMsg.pessoa !== S.me && d.ultimaMsg.em > (S.visto.dem[d.id] || "");

function ligarResumo(d, novo){

    const mud = [];
    if (!novo) {
      if (campos.etapa !== atual.etapa) mud.push(`moveu de ${atual.etapa} para ${campos.etapa}`);
      if (campos.responsavel !== atual.responsavel) mud.push(`passou a responsabilidade para ${pessoa(campos.responsavel).nome}`);
      if ((campos.prazo || "") !== (atual.prazo || "")) mud.push(`alterou o prazo para ${fmtData(campos.prazo)}`);

    for (const m of mud) historico = [...historico.slice(-149), {em: agoraISO(), pessoa: S.me, txt: m}];
    const body = {

function attsHtml(anexos){

    ? `<a class="img" data-blob="${esc(a.id)}" target="_blank" rel="noopener" title="${esc(a.nome)}"><img data-blob="${esc(a.id)}" alt="${esc(a.nome)}"></a>`
    : `<a class="file" data-blob="${esc(a.id)}" target="_blank" rel="noopener">${ICON.file}<span>${esc(a.nome)}</span></a>`).join("")}</div>`;

function chatHtml(msgs, comDemanda){
  let dia = "", h = "";
  for (const m of msgs) {
    const dd = new Date(m.em).toLocaleDateString("sv-SE");
    if (dd !== dia) { dia = dd; h += `<div class="chat-day">${dd === hoje() ? "Hoje" : dd === addDias(hoje(), -1) ? "Ontem" : esc(fmtDia(dd))}</div>`; }
    const dem = comDemanda && m.demandaId ? S.demandas.find(x => x.id === m.demandaId) : null;
    h += `<div class="msg ${m.pessoa === S.me ? "me" : ""}"><span class="av">${esc(pessoa(m.pessoa).ini)}</span><div class="bubble">
      <div class="h"><b>${esc(primeiro(m.pessoa))}</b><span>${fmtHora(m.em)}</span></div>
      ${dem ? `<button type="button" class="dem" data-open="${dem.id}">${esc(dem.codigo + " · " + dem.cliente)}</button>` : ""}
      ${m.texto ? `<div class="tx">${esc(m.texto)}</div>` : ""}${attsHtml(m.anexos)}</div></div>`;
  }
  return h || `<p class="muted" style="text-align:center">Nenhuma mensagem ainda.</p>`;

function paneConversa(d){

  const c = $("#dl-chat"); const noFim = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  c.innerHTML = chatHtml(msgs, false);
  if (noFim || !c.dataset.init) { c.scrollTop = c.scrollHeight; c.dataset.init = 1; }

async function prepararArquivo(file){
  if (!isImg(file.type) || file.type === "image/gif" || file.size < 900000) return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
    return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type: "image/jpeg"}) : file;
  } catch { return file; }
}
async function enviarArquivos(files, pendEl){
  const out = [];
  for (const [i, f0] of [...files].entries()) {
    if (pendEl) pendEl.textContent = `Enviando arquivo ${i + 1} de ${files.length}…`;
    const f = await prepararArquivo(f0);
    try { const r = await S.assets.upload(f, f.type ? undefined : {type: "application/octet-stream"}); out.push({id: r.id, nome: f0.name, tipo: r.contentType}); }
    catch (err) {
      const msg = {too_large: "arquivo maior que 20 MB", unsupported_type: "tipo de arquivo não aceito (use foto, PDF ou texto)", quota_or_state: "espaço de arquivos cheio", rate_limited: "muitos envios seguidos, aguarde um pouco"}[err?.code] || "falha no envio";
      toast(`${f0.name}: ${msg}`);
    }
  }
  if (pendEl) pendEl.textContent = "";
  return out;
}
async function enviarMensagem(pref){
  if (pref === "pt") { document.querySelector('[data-composer="pt"]')?.requestSubmit(); return; }
  const txtEl = $(`#${pref}-txt`); const fileEl = $(`#${pref}-file`); const pendEl = $(`#${pref}-pend`);
  const texto = txtEl.value.trim(); const files = fileEl?.files || [];
  if (!texto && !files.length) return;
  const btn = document.querySelector(`[data-composer="${pref}"] .btn.primary`); btn.disabled = true;
  txtEl.value = "";
  const anexos = files.length ? await enviarArquivos(files, pendEl) : [];
  if (fileEl) fileEl.value = "";
  if (!texto && !anexos.length) { btn.disabled = false; return; }
  const msg = {id: uid(), em: agoraISO(), texto};
  if (anexos.length) msg.anexos = anexos;
  try {
    if (pref === "dc" || pref === "da" || pref === "cv") {
      const id = pref === "cv" ? S.convSel : S.dlg.id; const d = S.demandas.find(x => x.id === id);
      const docsConv = pref === "cv" ? S.conv[id] : S.dlg.conversa;
      if (!docsConv) { txtEl.value = texto; toast("Aguarde a conversa carregar e tente de novo."); btn.disabled = false; return; }
      const meu = docsConv.find(c => c.id === S.me);
      await S.db.doc(`demandas/${id}/conversa/${S.me}`).set({pessoa: S.me, msgs: [...(meu?.msgs || []).slice(-299), msg], ...(d?.exemplo ? {exemplo: true} : {})});
      await S.db.doc("demandas/" + id).update({ultimaMsg: {em: msg.em, pessoa: S.me}, ...(anexos.length ? {historico: histAdd(d, `anexou ${anexos.length} arquivo${anexos.length > 1 ? "s" : ""}`)} : {})});
      S.visto.dem[id] = msg.em; salvarVisto();
    } else {
      const dem = $(`#${pref}-dem`)?.value; if (dem) msg.demandaId = dem;
      const docId = `${hoje()}_${S.me}`; const meu = S.mural.find(m => m.id === docId);
      await S.db.doc("mural/" + docId).set({pessoa: S.me, data: hoje(), msgs: [...(meu?.msgs || []), msg]});
      S.visto.mural = msg.em; salvarVisto();
    }
  } catch (err) { txtEl.value = texto; falhaEscrita(err); }
  btn.disabled = false;
}

function modelosCliente(d){

  const sv = d.servicos || []; const serv = sv.length ? "serviço de " + (sv.length > 1 ? sv.slice(0, -1).join(", ") + " e " + sv.slice(-1) : sv[0]) : "serviço";
  const docs = (d.checklist || []).filter(i => i.doc && !i.ok).map(i => "• " + i.t).join("\n");
  const pc = proximoCampo(d.id);
  const f = S.fin[d.id]; const ent = entradaInfo(f);
  const out = [];
  out.push({k: "docs", t: "Pedido de documentos", txt: `Olá, ${nome}! Aqui é ${eu}, da Saotech Geotecnologia.\n\nPara darmos andamento ao ${serv}, precisamos dos seguintes documentos:\n${docs || "• (marque no checklist os documentos que faltam)"}\n\nPode enviar foto ou PDF por aqui mesmo. Qualquer dúvida, estamos à disposição.`});
  out.push({k: "campo", t: "Aviso de campo", txt: pc
    ? `Olá, ${nome}! Aqui é ${eu}, da Saotech Geotecnologia.\n\nNossa equipe estará no imóvel${d.imovel ? " " + d.imovel : ""} no dia ${fmtData(pc.data)} (${DIAS_LONGO[new Date(pc.data + "T12:00:00").getDay()]}), a partir das ${pc.inicio}${prazoEv(pc) > pc.data ? `, com trabalhos previstos até ${fmtData(prazoEv(pc))}` : ""}.\n\nPedimos que o acesso esteja liberado e, se possível, que alguém que conheça as divisas acompanhe o levantamento.`
    : `Olá, ${nome}! Aqui é ${eu}, da Saotech Geotecnologia.\n\nGostaríamos de agendar o levantamento de campo${d.imovel ? " no imóvel " + d.imovel : ""}. Qual o melhor dia para você nesta ou na próxima semana?`});
  out.push({k: "entrada", t: "Entrada para início", txt: `Olá, ${nome}! Aqui é ${eu}, da Saotech Geotecnologia.\n\nObrigado por aprovar a proposta do ${serv}.${S.podeFin && f?.entradaValor ? ` O valor da entrada é ${brl(f.entradaValor)}${ent?.venc ? `, com vencimento em ${fmtData(ent.venc)}` : ""}.` : ""} Assim que confirmarmos o pagamento da entrada, agendamos o trabalho de campo.\n\nSe precisar dos dados para pagamento, é só pedir.`});
  if (d.protocoloOrgao || d.protocoloNumero) out.push({k: "prot", t: "Protocolo realizado", txt: `Olá, ${nome}! Aqui é ${eu}, da Saotech Geotecnologia.\n\nO processo foi protocolado${d.protocoloOrgao ? " no " + d.protocoloOrgao : ""}${d.protocoloNumero ? ", sob o nº " + d.protocoloNumero : ""}.${d.protocoloPrevisao ? ` A previsão de retorno é ${fmtData(d.protocoloPrevisao)}.` : ""} Avisaremos assim que houver novidade.`});
  out.push({k: "conf", t: "Documentos para confrontantes", txt: `Olá! Aqui é ${eu}, da Saotech Geotecnologia.\n\nEstamos fazendo o levantamento do imóvel vizinho${d.imovel ? " (" + d.imovel + ")" : ""} e precisamos de algumas documentações básicas pessoais do senhor e de sua propriedade, caso tenha:\n\nPessoais: CPF, RG, certidão de casamento (caso seja casado), certidão de óbito (caso seja viúvo) e endereço de residência.\n\nPropriedade: certidão de inteiro teor mais atual (número da matrícula, CCIR e ITR), levantamento topográfico georreferenciado e certificação no SIGEF.\n\nPode enviar foto ou PDF por aqui mesmo. Obrigado!`});
  out.push({k: "fim", t: "Serviço concluído", txt: `Olá, ${nome}! Aqui é ${eu}, da Saotech Geotecnologia.\n\nO ${serv} foi concluído. Vamos te enviar os arquivos e documentos finais. Obrigado pela confiança!`});
  return out;
}

}
function gcalLink(a){
  const g = gcalInput(a); const fmt = iso => iso.slice(0, 19).replace(/[-:]/g, "");
  const emails = (a.pessoas || []).map(p => S.config.emails?.[p]).filter(Boolean);
  const q = new URLSearchParams({action: "TEMPLATE", text: g.summary, dates: fmt(g.startTime) + "/" + fmt(g.endTime), ctz: "America/Sao_Paulo", details: g.description, location: g.location});
  if (emails.length) q.set("add", emails.join(","));
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function gcalInput(a){
  const d = S.demandas.find(x => x.id === a.demandaId);
  const summary = `${a.tipo}: ${d ? d.codigo + " · " + d.cliente : (a.titulo || "Saotech")}`;
  const desc = [d ? `Demanda ${d.codigo} · ${d.cliente}` : "", d?.imovel ? `Imóvel: ${d.imovel}` : "", `Equipe: ${(a.pessoas || []).map(p => pessoa(p).nome).join(", ")}`, a.obs, "Criado pela Gestão Saotech"].filter(Boolean).join("\n");
  const pz = prazoEv(a); let fimH = "18:00";
  if (pz === a.data && a.inicio >= "17:00") { const m = Math.min(min(a.inicio) + 60, 23 * 60 + 59); fimH = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
  return {summary, startTime: `${a.data}T${a.inicio}:00-03:00`, endTime: `${pz}T${fimH}:00-03:00`, timeZone: "America/Sao_Paulo", location: a.local || d?.municipio || "", description: desc};
}
async function sincronizarGcal(id, a){
  const base = gcalInput(a);
  const emails = (a.pessoas || []).map(p => S.config.emails?.[p]).filter(Boolean);
  try {
    if (a.gcalId) {
      await S.mcp.callTool(GCAL, "update_event", {eventId: a.gcalId, summary: base.summary, startTime: base.startTime, endTime: base.endTime, timeZone: base.timeZone, location: base.location, description: base.description});
    } else {
      const r = await S.mcp.callTool(GCAL, "create_event", {...base, attendees: emails.map(email => ({email})), useDefaultReminders: true});
      const p = r?.payload || {}; const ev = p.event || p;
      const gid = ev.id || ev.eventId || p.id || p.eventId || null;
      await S.db.doc("agenda/" + id).update({gcalId: gid, gcalPor: S.me, gcalLink: ev.htmlLink || null});
      toast(emails.length ? `Enviado ao Google Agenda e convite para ${emails.length} pessoa${emails.length > 1 ? "s" : ""}` : "Enviado ao seu Google Agenda");
    }
  } catch (err) { avisoGcal(err, a.gcalId ? "atualizar o Google Agenda" : "enviar ao Google Agenda"); }
}
function avisoGcal(err, acao){
  const c = err?.code;
  const m = c === "server_not_connected" ? "conecte o Google Calendar em claude.ai → Configurações → Conectores"
    : c === "needs_reauth" ? "reconecte o Google Calendar em claude.ai → Configurações → Conectores"
    : c === "not_in_manifest" ? "você não permitiu o Google Agenda nesta página; recarregue e permita"
    : c === "selection_required" ? "escolha qual conta do Google Calendar usar no aviso do claude.ai"
    : c === "blocked_by_policy" || c === "approval_required" ? "a organização bloqueou esse uso do Google Agenda"
    : c === "tool_error" ? (err.message || "o Google Agenda recusou (só quem criou o evento pode alterá-lo)")
    : "tente de novo em instantes";
  toast(`O compromisso foi salvo, mas não foi possível ${acao}: ${m}.`);
}

async function salvarRegistro(docId, pessoaId, data, itens, exemplo){

/* ---------- View: Produtividade ---------- */
function agregados(pessoaId, dias){
  const desde = addDias(hoje(), -(dias - 1));
  const regs = S.registros.filter(r => r.data >= desde && r.data <= hoje() && (!pessoaId || r.pessoa === pessoaId));
  const porTipo = {}, porDia = [0,0,0,0,0,0,0], heat = DIAS.map(() => BLOCOS.map(() => 0)), porPessoa = {};
  let total = 0, feitas = 0, pend = 0, n = 0, semDem = 0, tardio = 0; const diasComReg = new Set(); const pendentes = [];
  for (const r of regs) {
    const wd = new Date(r.data + "T12:00:00").getDay();
    for (const i of r.itens || []) {
      const m = dur(i); n++;
      total += m; porTipo[i.tipo] = (porTipo[i.tipo] || 0) + m; porDia[wd] += m;
      porPessoa[r.pessoa] = (porPessoa[r.pessoa] || 0) + m;
      if (m) diasComReg.add(r.data);
      if (i.status === "pendente") { pend++; pendentes.push({...i, _data: r.data, _pessoa: r.pessoa, _doc: r.id}); } else feitas++;
      if (!i.demandaId && !TIPOS_SEM_DEMANDA.includes(i.tipo)) semDem += m;
      const a = min(i.inicio), b = min(i.fim);
      if (a != null && b > a) {
        BLOCOS.forEach((h, k) => { const s = h * 60, e = s + 120; const o = Math.max(0, Math.min(b, e) - Math.max(a, s)); heat[wd][k] += o; });
        tardio += Math.max(0, b - Math.max(a, 19 * 60));
      }
    }
  }
  return {regs, porTipo, porDia, heat, porPessoa, total, feitas, pend, n, semDem, tardio, diasComReg: diasComReg.size, pendentes};
}
function dicas(A, pessoaId){
  const out = [];
  const nome = pessoaId ? primeiro(pessoaId) : "a equipe";
  if (!A.n) return [{w: false, t: `Ainda não há atividades registradas neste período para ${esc(nome)}. Registrar ao fim de cada bloco de trabalho leva menos de um minuto e é o que alimenta estes gráficos.`}];
  const tipos = Object.entries(A.porTipo).sort((a, b) => b[1] - a[1]);
  const [t1, m1] = tipos[0];
  out.push({w: false, t: `<b>${Math.round(m1 / A.total * 100)}%</b> das horas foram em <b>${esc(t1)}</b>${tipos[1] ? `, seguido de ${esc(tipos[1][0])} (${Math.round(tipos[1][1] / A.total * 100)}%)` : ""}.`});
  const desl = A.porTipo["Deslocamento"] || 0;
  if (desl / A.total > 0.2) out.push({w: true, t: `Deslocamento ocupa <b>${Math.round(desl / A.total * 100)}%</b> do tempo. Agrupe campanhas de campo por município ou região na mesma viagem (use a Agenda de campo) e confirme documentos e acesso ao imóvel antes de sair.`});
  let best = null, bv = 0;
  A.heat.forEach((row, d) => row.forEach((v, k) => { if (v > bv) { bv = v; best = [d, k]; } }));
  if (best) out.push({w: false, t: `Maior volume de trabalho: <b>${DIAS_LONGO[best[0]]}, ${BLOCOS[best[1]]}h–${BLOCOS[best[1]] + 2}h</b>. Reserve esse horário para o que exige concentração (processamento, desenho CAD, memoriais) e deixe ligações e mensagens para depois.`});
  const uteis = [1,2,3,4,5].filter(d => A.porDia[d] > 0);
  if (uteis.length >= 3) { const lo = uteis.reduce((a, b) => A.porDia[a] <= A.porDia[b] ? a : b); if (A.porDia[lo] < A.total / uteis.length * 0.6) out.push({w: false, t: `<b>${DIAS_LONGO[lo][0].toUpperCase() + DIAS_LONGO[lo].slice(1)}</b> é o dia útil com menos horas registradas. Use-o para tarefas curtas: protocolo, atendimento, conferência de documentos.`}); }
  const velhas = A.pendentes.filter(p => diff(hoje(), p._data) > 5);
  if (velhas.length) out.push({w: true, t: `<b>${velhas.length}</b> pendência${velhas.length > 1 ? "s" : ""} com mais de 5 dias. Conclua, reagende com data ou passe para outra pessoa.`});
  else if (A.pend) out.push({w: false, t: `${A.pend} atividade${A.pend > 1 ? "s" : ""} pendente${A.pend > 1 ? "s" : ""}, todas recentes.`});
  if (A.semDem / A.total > 0.3) out.push({w: true, t: `<b>${Math.round(A.semDem / A.total * 100)}%</b> das horas técnicas não estão ligadas a uma demanda. Vincular permite saber quanto cada serviço custa de verdade e precificar melhor.`});
  const media = A.total / A.n;
  if (A.n >= 8 && media < 45) out.push({w: true, t: `Blocos de trabalho curtos (média de ${Math.round(media)} min). Muitas trocas de tarefa reduzem o rendimento; tente blocos de 90 min para processamento e CAD.`});
  if (A.tardio / A.total > 0.1) out.push({w: true, t: `<b>${Math.round(A.tardio / A.total * 100)}%</b> das horas foram depois das 19h. Vale redistribuir a carga para evitar cansaço e erro de digitação em coordenadas.`});
  return out;
}

function viewFinanceiro(){
  const linhas = S.demandas.map(d => ({d, f: S.fin[d.id] || {}})).map(x => ({...x, r: finResumo(x.f)})).filter(x => x.r.ps.length || x.r.legado);
  const mes = hoje().slice(0, 7);
  let receber = 0, atrasadas = 0, recebidoMes = 0, ativos = 0;
  const pagamentos = [];
  for (const x of linhas) {
    receber += x.r.aberto; atrasadas += x.r.atrasadas; if (!x.r.quitado && x.r.aberto > 0) ativos++;
    for (const p of x.r.ps) if (p.pago) { pagamentos.push({d: x.d, p}); if ((p.pago.data || "").startsWith(mes)) recebidoMes += p.pago.valor ?? p.valor ?? 0; }
  }
  linhas.sort((a, b) => b.r.atrasadas - a.r.atrasadas || ((a.r.proxima?.vencimento || "9") < (b.r.proxima?.vencimento || "9") ? -1 : 1));
  pagamentos.sort((a, b) => (b.p.pago.data + b.p.pago.hora) > (a.p.pago.data + a.p.pago.hora) ? 1 : -1);

    ${linhas.map(({d, f, r}) => { const pct = r.total ? Math.min(100, Math.round(r.pago / r.total * 100)) : 0; const st = r.quitado ? {txt: "Quitado", cls: ""} : r.proxima ? statusParcela(r.proxima) : {txt: r.legado ? "lançar parcelas" : "—", cls: ""};
      return `<button type="button" class="fin-ct" data-proc="${d.id}">
        <span class="a"><b>${esc(d.cliente)}</b><span class="sub">${esc(d.codigo)} · ${esc(f.modo || "valor antigo")} · <span class="pill ${etapaCls(d.etapa)}">${esc(d.etapa)}</span></span></span>
        <span class="b"><span class="num"><b>${brl(r.pago)}</b> <span class="sub">de ${brl(r.total)}</span></span><span class="prog"><i style="width:${pct}%"></i></span></span>
        <span class="c"><span class="due ${st.cls}">${esc(r.quitado ? "Quitado" : st.txt)}</span>${r.proxima && !r.quitado ? `<span class="sub">${esc(r.proxima.rotulo)} · ${fmtData(r.proxima.vencimento)} · ${brl(r.proxima.valor)}</span>` : ""}</span>
      </button>`; }).join("") || `<p class="muted" style="margin:0">Nenhum contrato lançado. Abra um cliente em Clientes e toque em "Lançar contrato fechado".</p>`}
  </div>
  ${semContrato.length ? `<div class="card" style="margin-top:16px"><h3>Processos em andamento sem contrato</h3>${semContrato.map(d => `<div class="vin"><button type="button" class="li" data-proc="${d.id}"><span class="t"><b>${esc(d.cliente)}</b> · ${esc(d.etapa)}</span></button><button type="button" class="btn sm" data-contrato="${d.id}">Lançar</button></div>`).join("")}</div>` : ""}

    ${pagamentos.slice(0, 30).map(({d, p}) => `<div class="fin-pg"><div><b>${brl(p.pago.valor ?? p.valor)}</b> · ${esc(p.pago.forma || "")}<div class="sub">${esc(d.cliente)} · ${esc(p.rotulo)}</div></div><div style="text-align:right"><span class="sub">${fmtData(p.pago.data)} ${esc(p.pago.hora || "")}</span>${compLink(p.pago.comprovante)}</div></div>`).join("") || `<p class="muted" style="margin:0">Nenhum pagamento registrado ainda.</p>`}

/* ---------- Contrato e pagamentos (só Moisés Bruno / administradores) ---------- */
const FORMAS_PG = ["Pix", "Transferência / TED", "Boleto", "Dinheiro", "Cartão de crédito", "Cartão de débito", "Cheque"];
const MODOS = ["À vista", "Parcelado", "Entrada + parcelas"];
const numBR = v => { if (v == null || v === "") return null; const t = String(v).trim().replace(/[R$\s]/g, ""); const n = parseFloat(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t); return isNaN(n) ? null : Math.round(n * 100) / 100; };
const fmtNum = v => v == null ? "" : Number(v).toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const addMeses = (iso, n) => { const d = new Date(iso + "T12:00:00"); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(dia, ult)); return d.toLocaleDateString("sv-SE"); };
function finResumo(f){
  f = f || {};
  const ps = f.parcelas || [];
  if (!ps.length) {
    const total = f.valorTotal || 0, ent = f.entradaValor || 0;
    const pago = (f.entradaPagaEm ? ent : 0) + (f.saldoPagoEm ? Math.max(0, total - ent) : 0);
    return {total, pago, aberto: Math.max(0, total - pago), atrasadas: entradaInfo(f)?.vencida ? 1 : 0, proxima: null, ps, legado: !!(total || f.aceiteEm)};
  }
  const total = f.valorTotal || ps.reduce((s, p) => s + (p.valor || 0), 0);
  const pago = ps.reduce((s, p) => s + (p.pago ? (p.pago.valor ?? p.valor ?? 0) : 0), 0);
  const abertas = ps.filter(p => !p.pago).sort((a, b) => (a.vencimento || "9") < (b.vencimento || "9") ? -1 : 1);
  return {total, pago, aberto: Math.max(0, total - pago), atrasadas: abertas.filter(p => p.vencimento && p.vencimento < hoje()).length, proxima: abertas[0] || null, ps, quitado: !abertas.length};
}

function gerarParcelas(modo, total, aceite, o){
  const out = []; const id = () => uid();
  total = total || 0;
  if (modo === "À vista") return [{id: id(), n: 0, rotulo: "À vista", valor: total, vencimento: o.venc1 || aceite}];
  let resto = total, n = Math.max(1, o.n || 1), venc = o.venc1 || addDias(aceite, 30);
  if (modo === "Entrada + parcelas") {
    const ent = Math.min(total, o.entrada || 0);
    out.push({id: id(), n: 0, rotulo: "Entrada", valor: ent, vencimento: o.vencEnt || addDias(aceite, 3)});
    resto = Math.round((total - ent) * 100) / 100;
  }
  const base = Math.floor(resto / n * 100) / 100;
  for (let i = 0; i < n; i++) {
    const v = i === n - 1 ? Math.round((resto - base * (n - 1)) * 100) / 100 : base;
    out.push({id: id(), n: i + 1, rotulo: `Parcela ${i + 1}/${n}`, valor: v, vencimento: addMeses(venc, i)});
  }
  return out;
}
function sincronizarLegado(f){
  const ps = f.parcelas || []; if (!ps.length) return f;
  const p0 = ps[0];
  f.entradaValor = p0.valor; f.entradaPagaEm = p0.pago ? p0.pago.data : null;
  const todas = ps.every(p => p.pago);
  f.saldoPagoEm = todas ? ps.map(p => p.pago.data).sort().slice(-1)[0] : null;
  return f;
}
async function salvarFin(id, f, logTxt){
  const corpo = sincronizarLegado({...f, atualizadoEm: agoraISO()});
  if (logTxt) corpo.log = [...(f.log || []).slice(-199), {em: agoraISO(), pessoa: S.me, txt: logTxt}];
  delete corpo.id;
  await S.finCol.doc(id).set(corpo);
}

  if (!dlg.open) dlg.showModal();

function alertaPrazoHtml(){
  if (S.alertaFechado || !S.conectado) return "";
  const av = avisosPrazo(); if (!av.length) return "";

function expedienteStats(pessoaId, dias){
  const desde = addDias(hoje(), -(dias - 1));

  const mh = arr => { if (!arr.length) return "—"; const m = Math.round(arr.reduce((s, v) => s + v, 0) / arr.length); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
  const minDia = iso => { const d = new Date(iso); return d.getHours() * 60 + d.getMinutes(); };
  return {dias: xs.length, fechados: fechados.length, total, mediaIni: mh(xs.map(x => minDia(x.inicio))), mediaFim: mh(fechados.map(x => minDia(x.fim))), semFim: xs.filter(x => !x.fim && x.data < hoje()).length};

let _curvas = null;
function curvasSVG(){
  if (_curvas) return _curvas;
  let p = "";
  for (const [cx, cy, n, s] of [[150, 30, 9, 1], [30, 95, 6, -1]]) {
    for (let k = 1; k <= n; k++) {
      const r = k * 7.5; let d = "";
      for (let i = 0; i <= 72; i++) {
        const t = i / 72 * Math.PI * 2;
        const rr = r * (1 + .13 * Math.sin(3 * t + k * .45 * s) + .06 * Math.sin(5 * t - k * .3) + .03 * Math.cos(7 * t + k));
        d += (i ? "L" : "M") + (cx + rr * Math.cos(t) * 1.45).toFixed(1) + " " + (cy + rr * Math.sin(t)).toFixed(1);
      }
      p += `<path d="${d}Z"/>`;
    }
  }
  return _curvas = `<svg class="curvas" viewBox="0 0 200 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${p}</svg>`;
}

/* ---------- Vínculos entre processos (confrontantes, mesmo cliente) ---------- */
const RELACOES = ["Confrontante", "Mesmo cliente", "Relacionado"];
function vinculosDe(d){
  const out = [];
  for (const v of d.vinculos || []) { const o = S.demandas.find(x => x.id === v.id); if (o) out.push({o, rel: v.rel || "Relacionado", obs: v.obs || ""}); }
  for (const o of S.demandas) if (o.id !== d.id && !out.some(x => x.o.id === o.id) && baseCliente(o.cliente) && baseCliente(o.cliente) === baseCliente(d.cliente)) out.push({o, rel: "Mesmo cliente", obs: "", auto: true});
  const ordem = r => RELACOES.indexOf(r);
  return out.sort((a, b) => ordem(a.rel) - ordem(b.rel) || (a.o.cliente || "").localeCompare(b.o.cliente || "", "pt-BR"));
}
function vinculosHtml(d){
  const vs = vinculosDe(d); const podeEd = !S.somenteLeitura;
  const conf = vs.filter(v => v.rel === "Confrontante").length;
  const opcoes = S.demandas.filter(o => o.id !== d.id && !vs.some(v => v.o.id === o.id)).sort((a, b) => (a.cliente || "").localeCompare(b.cliente || "", "pt-BR"));
  return `<div class="card"><h3>Confrontantes e vínculos${conf ? ` <span class="chip">${conf} confrontante${conf > 1 ? "s" : ""}</span>` : ""}</h3>
    ${vs.map(v => `<div class="vin"><button type="button" class="li" data-proc="${v.o.id}"><span class="t"><span class="chip rel-${v.rel === "Confrontante" ? "conf" : v.rel === "Mesmo cliente" ? "cli" : "out"}">${esc(v.rel)}</span> <b>${esc(v.o.cliente)}</b>${v.obs ? ` <span class="sub">· ${esc(v.obs)}</span>` : ""}</span><span class="pill ${etapaCls(v.o.etapa)}">${esc(v.o.etapa)}</span></button>${podeEd && !v.auto ? `<button type="button" class="btn sm ghost" data-vinrm="${d.id}|${v.o.id}" aria-label="Remover vínculo" title="Remover vínculo">✕</button>` : ""}</div>`).join("") || `<p class="sub" style="margin:0">Nenhum vínculo. Ligue aqui os confrontantes deste imóvel ou outros processos do mesmo cliente.</p>`}
    ${podeEd && opcoes.length ? `<form class="vin-add" id="fVin" data-dem="${d.id}">
      <select id="vin-dem" aria-label="Processo" required><option value="">Vincular a…</option>${opcoes.map(o => `<option value="${o.id}">${esc(o.cliente)} · ${esc(o.codigo)}</option>`).join("")}</select>
      <select id="vin-rel" aria-label="Tipo de vínculo">${RELACOES.map(r => `<option>${r}</option>`).join("")}</select>
      <input id="vin-obs" placeholder="Lado ou observação (opcional)" aria-label="Observação">
      <button class="btn">Vincular</button></form>` : ""}
  </div>`;
}
function trelloArqHtml(d){
  const a = d.anexosTrello || []; if (!a.length) return "";
  return `<div class="card"><h3>Arquivos no Trello <span class="chip">${a.length}</span></h3>
    <p class="sub" style="margin:0 0 6px">Abrem no Trello (é preciso estar conectado à conta da equipe).</p>
    ${a.map(x => `<a class="li" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="t">${ICON.file} ${esc(x.nome)}</span><span class="sub">${esc(x.origem || "")}</span></a>`).join("")}</div>`;
}
async function salvarVinculo(aId, bId, rel, obs, remover){
  const a = S.demandas.find(x => x.id === aId), b = S.demandas.find(x => x.id === bId); if (!a || !b) return;
  const semB = (a.vinculos || []).filter(v => v.id !== bId), semA = (b.vinculos || []).filter(v => v.id !== aId);
  const va = remover ? semB : [...semB, {id: bId, rel, obs}];
  const vb = remover ? semA : [...semA, {id: aId, rel, obs: ""}];
  const txtA = remover ? `removeu o vínculo com ${b.cliente}` : `vinculou ${b.cliente} como ${rel.toLowerCase()}`;
  const txtB = remover ? `removeu o vínculo com ${a.cliente}` : `vinculou ${a.cliente} como ${rel.toLowerCase()}`;
  try {
    await S.db.doc("demandas/" + aId).update({vinculos: va, historico: histAdd(a, txtA), atualizadoEm: agoraISO()});
    await S.db.doc("demandas/" + bId).update({vinculos: vb, historico: histAdd(b, txtB), atualizadoEm: agoraISO()});
    toast(remover ? "Vínculo removido" : "Vínculo criado nos dois processos");
  } catch (err) { falhaEscrita(err); }
}
document.addEventListener("submit", e => {
  if (e.target.id !== "fVin") return; e.preventDefault();
  const b = $("#vin-dem").value; if (!b) return;
  salvarVinculo(e.target.dataset.dem, b, $("#vin-rel").value, $("#vin-obs").value.trim());
});
document.addEventListener("click", e => {
  const r = e.target.closest("[data-vinrm]"); if (!r) return; e.stopPropagation();
  const [a, b] = r.dataset.vinrm.split("|"); salvarVinculo(a, b, "", "", true);
}, true);

/* ---------- View: Clientes (processo completo de cada cliente) ---------- */
const baseCliente = c => String(c || "").split(/\s+[—–-]\s+/)[0].trim().toLowerCase();
function datasEtapas(d){
  const out = {};
  for (const h of d.historico || []) {
    if (/^criou a demanda/.test(h.txt)) out["Orçamento"] = out["Orçamento"] || h.em.slice(0, 10);
    const m = /^moveu de .+ para (.+)$/.exec(h.txt); if (m) out[m[1]] = h.em.slice(0, 10);
  }
  if (!out["Orçamento"] && d.criadoEm) out["Orçamento"] = d.criadoEm.slice(0, 10);
  return out;
}
function linhaDoTempo(d){
  const it = [];
  for (const h of d.historico || []) { if (/^anexou /.test(h.txt)) continue; it.push({em: h.em, k: /^moveu de |^criou a demanda/.test(h.txt) ? "etapa" : "hist", pessoa: h.pessoa, txt: h.txt}); }
  for (const a of S.agenda.filter(x => x.demandaId === d.id)) {
    const em = new Date(a.data + "T" + (a.inicio || "08:00") + ":00").toISOString();
    it.push({em, k: "agenda", a, futuro: prazoEv(a) >= hoje()});
  }
  for (const m of msgsDemanda(d.id)) it.push({em: m.em, k: m.ficha ? "ficha" : "msg", pessoa: m.pessoa, txt: m.texto, anexos: m.anexos, ficha: m.ficha});
  return it.sort((a, b) => a.em < b.em ? 1 : -1);
}

  const ia = Math.max(0, principais.findIndex(e => e.k === atual));

    if (x.k === "ficha") return fichaTlHtml(x);

  const clItem = i => `<label class="cl-item ${i.ok ? "ok" : ""}"><input type="checkbox" data-clp="${d.id}|${i.id}" ${i.ok ? "checked" : ""} ${S.somenteLeitura ? "disabled" : ""}><div><span class="t">${esc(i.t)}</span>${i.ok && i.por ? `<div class="by">${esc(primeiro(i.por))} · ${fmtQuando(i.em)}</div>` : ""}</div></label>`;

      </div>

        ${tel ? `<a class="btn" href="https://wa.me/${tel}" target="_blank" rel="noopener">WhatsApp do cliente</a>` : ""}
        ${arqs.length ? `<button type="button" class="btn" data-galdem="${d.id}">Arquivos (${arqs.length})</button>` : ""}

    ${d.etapa === "Pausada" ? `<div class="banner" style="margin-top:12px">Processo pausado na etapa <b>&nbsp;${esc(atual)}</b>.</div>` : ""}
    <div class="card" style="margin-top:12px"><div class="stepper">${stepper}</div></div>
    ${pendenciasBanner(d)}
    <section class="pstats">
      <div class="pst"><span class="label">Checklist</span><b>${ok}/${cl.length}</b>${cl.length ? `<div class="prog"><i style="width:${Math.round(ok / cl.length * 100)}%"></i></div>` : `<span class="sub">sem itens</span>`}</div>
